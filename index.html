/**
 * Proposes a new record, a change, archiving, or a review of an existing draft.
 * Nothing live changes until it is approved and published.
 * @param {{type: string, changeType: 'create'|'update'|'archive'|'review', key?: string,
 *          fields?: Object, baseVersion?: number, note: string}} p
 */
function adminPropose(p) {
  return adminCall_('editor', function (me) {
    p = p || {};
    var type = p.type, t = adminType_(type), def = schemaFor_(type);
    var changeType = p.changeType;
    if (['create', 'update', 'archive', 'review'].indexOf(changeType) < 0) throw new Error('Unknown change type.');
    if (changeType === 'archive' && t.noArchive) throw new Error(type + ' links cannot be archived here; remove the row in the Sheet.');
    var note = cleanText_(p.note || '', 1000);
    if (!note) throw new Error('Add a short note saying what changed and why (the reviewer sees it).');

    var current = changeType === 'create' ? null : findRecord_(type, p.key);
    if (changeType !== 'create' && !current) throw new Error('Record not found: ' + p.key);
    var proposed = {};
    if (changeType === 'create' || changeType === 'update') {
      var check = checkFields_(type, p.fields || {}, current);
      if (check.errors.length) return { ok: false, errors: check.errors };
      proposed = check.values;
      if (changeType === 'update' && !Object.keys(diffFields_(type, current, proposed)).length) {
        return { ok: false, errors: ['Nothing changed. Use "Submit for review" to have the current version reviewed.'] };
      }
    }
    var key = changeType === 'create' ? recordKey_(type, proposed) : p.key;
    if (changeType === 'create' && findRecord_(type, key)) return { ok: false, errors: ['ID already exists: ' + key] };
    if (changeType !== 'create' && current.version !== null && current.version !== undefined &&
        p.baseVersion !== undefined && p.baseVersion !== null && Number(p.baseVersion) !== Number(current.version)) {
      return { ok: false, errors: ['This record changed (version ' + current.version + ') while you were editing. Reload it and try again.'] };
    }

    var lock = LockService.getScriptLock();
    lock.waitLock(30000);
    try {
      var ss = getDb_();
      // An open proposal for the same record is replaced (superseded) by the new one.
      var open = openReviewsByKey_(type)[key];
      if (open) {
        if (open.requested_by !== me.email && roleRank_(me.role) < roleRank_('reviewer')) {
          throw new Error('Another proposal for this record is open (by ' + open.requested_by + '). Ask a reviewer, or wait until it is done.');
        }
        updateReviewRow_(ss, open.review_id, { review_status: 'superseded', comments: appendComment_(open.comments, me.email, 'Replaced by a newer proposal') });
      }
      var id = newReviewId_();
      appendObjects_(ss.getSheetByName('ReviewQueue'), [sheetSafe_({
        review_id: id, record_type: type, record_id: key, record_version: current ? (current.version || 0) : 0,
        review_status: 'pending', requested_by: me.email, reviewer: '', reviewed_at: '', comments: '',
        change_type: changeType, topic_id: topicOf_(type, current, proposed), change_note: note,
        proposed: changeType === 'create' || changeType === 'update' ? JSON.stringify(proposed) : '',
        requested_at: nowStamp_(), source_checked: false, published_at: ''
      })]);
      logChange_(ss, changeType === 'create' ? 'create' : changeType === 'archive' ? 'archive' : 'update', type, key,
        'Proposed (' + changeType + ', ' + id + '): ' + note, String(current ? current.version || '' : ''), getContentVersion_());
      return { ok: true, reviewId: id, key: key };
    } finally { lock.releaseLock(); }
  });
}

/**
 * Proposes "review" for every draft row of one type in one topic (or all topics),
 * so seeded starter content can go through the review queue in one step.
 */
function adminSubmitDrafts(type, topicId, note) {
  return adminCall_('editor', function (me) {
    var t = adminType_(type);
    if (type === 'TopicDrugs') throw new Error('TopicDrugs rows have no status.');
    note = cleanText_(note || '', 1000) || 'Review starter content';
    var open = openReviewsByKey_(type);
    var rows = readTable_(type).filter(function (r) {
      return r.status !== 'published' && r.status !== 'archived' && (!topicId || !t.topic || r[t.topic] === topicId) && !open[recordKey_(type, r)];
    });
    if (!rows.length) return { ok: true, added: 0 };
    var lock = LockService.getScriptLock();
    lock.waitLock(30000);
    try {
      var ss = getDb_();
      var stamp = nowStamp_();
      appendObjects_(ss.getSheetByName('ReviewQueue'), rows.map(function (r) {
        return sheetSafe_({
          review_id: newReviewId_(), record_type: type, record_id: recordKey_(type, r), record_version: r.version || 0,
          review_status: 'pending', requested_by: me.email, reviewer: '', reviewed_at: '', comments: '',
          change_type: 'review', topic_id: t.topic ? r[t.topic] : '', change_note: note, proposed: '',
          requested_at: stamp, source_checked: false, published_at: ''
        });
      }));
      logChange_(ss, 'status_change', type, topicId || '(all)', 'Submitted ' + rows.length + ' draft(s) for review: ' + note, '', getContentVersion_());
      return { ok: true, added: rows.length };
    } finally { lock.releaseLock(); }
  });
}

/**
 * Review queue with a field-by-field comparison for each item.
 * @param {{status?: string, type?: string, topic?: string}} filter
 */
function adminQueue(filter) {
  return adminCall_('editor', function () {
    filter = filter || {};
    var states = filter.status ? [filter.status] : ADMIN_OPEN_STATES_;
    var items = readTable_('ReviewQueue').filter(function (q) {
      return states.indexOf(q.review_status) >= 0 && (!filter.type || q.record_type === filter.type) &&
        (!filter.topic || q.topic_id === filter.topic);
    });
    items.sort(function (a, b) { return String(a.requested_at).localeCompare(String(b.requested_at)); });
    return { total: items.length, items: items.slice(0, 200).map(reviewView_) };
  });
}

/**
 * Reviewer decision.
 * @param {{ids: string[], decision: 'approved'|'changes_requested'|'rejected', comment?: string, sourceChecked?: boolean}} d
 */
function adminDecide(d) {
  return adminCall_('reviewer', function (me) {
    d = d || {};
    var decision = d.decision;
    if (['approved', 'changes_requested', 'rejected'].indexOf(decision) < 0) throw new Error('Unknown decision.');
    var comment = cleanText_(d.comment || '', 1000);
    if (decision !== 'approved' && !comment) throw new Error('Say what needs to change (the editor sees this comment).');
    var ids = (d.ids || []).map(String).slice(0, 300);
    if (!ids.length) throw new Error('Choose at least one item.');
    var settings = readSettings_();
    var selfOk = settings.allow_self_review === undefined || settingBool_(settings, 'allow_self_review');
    var byId = {};
    readTable_('ReviewQueue').forEach(function (q) { byId[q.review_id] = q; });

    var lock = LockService.getScriptLock();
    lock.waitLock(30000);
    try {
      var ss = getDb_(), done = [], skipped = [];
      ids.forEach(function (id) {
        var q = byId[id];
        if (!q) { skipped.push(id + ': not found'); return; }
        if (q.review_status !== 'pending' && !(q.review_status === 'approved' && decision !== 'approved')) {
          skipped.push(id + ': already ' + q.review_status); return;
        }
        if (!selfOk && q.requested_by === me.email) { skipped.push(id + ': you proposed it; a second reviewer must decide (allow_self_review = FALSE)'); return; }
        var def = schemaFor_(q.record_type);
        var needsSource = def && def.columns.some(function (c) { return c.name === 'source_check'; }) && q.change_type !== 'archive';
        if (decision === 'approved' && needsSource && !d.sourceChecked) {
          skipped.push(id + ': tick "checked against the source" to approve clinical content'); return;
        }
        updateReviewRow_(ss, id, sheetSafe_({
          review_status: decision, reviewer: me.email, reviewed_at: nowStamp_(),
          source_checked: decision === 'approved' && !!d.sourceChecked,
          comments: appendComment_(q.comments, me.email, comment || (decision === 'approved' ? 'Approved' : ''))
        }));
        logChange_(ss, 'status_change', q.record_type, q.record_id, 'Review ' + id + ': ' + decision + (comment ? ' — ' + comment : ''), String(q.record_version || ''), getContentVersion_());
        done.push(id);
      });
      return { ok: true, done: done, skipped: skipped };
    } finally { lock.releaseLock(); }
  });
}

/** Editor withdraws their own open proposal (reviewers may withdraw any). */
function adminWithdraw(reviewId) {
  return adminCall_('editor', function (me) {
    var q = readTable_('ReviewQueue').filter(function (r) { return r.review_id === String(reviewId); })[0];
    if (!q) throw new Error('Not found.');
    if (ADMIN_OPEN_STATES_.indexOf(q.review_status) < 0) throw new Error('Already ' + q.review_status + '.');
    if (q.requested_by !== me.email && roleRank_(me.role) < roleRank_('reviewer')) throw new Error('Only the person who proposed it, or a reviewer, can withdraw it.');
    var ss = getDb_();
    updateReviewRow_(ss, q.review_id, { review_status: 'withdrawn', comments: appendComment_(q.comments, me.email, 'Withdrawn') });
    logChange_(ss, 'status_change', q.record_type, q.record_id, 'Review ' + q.review_id + ' withdrawn', '', getContentVersion_());
    return { ok: true };
  });
}

/**
 * Applies every approved change, validates the result as a whole, writes it, and
 * bumps the content version. If validation fails nothing is written.
 * @param {{dryRun?: boolean}} opts
 */
function adminPublish(opts) {
  return adminCall_('publisher', function (me) {
    opts = opts || {};
    var lock = LockService.getScriptLock();
    lock.waitLock(30000);
    try {
      var ss = getDb_();
      var input = readValidationInput_(ss);
      var tables = input.tables;
      var approved = tables.ReviewQueue.filter(function (q) { return q.review_status === 'approved'; });
      approved.sort(function (a, b) { return String(a.reviewed_at).localeCompare(String(b.reviewed_at)); });
      if (!approved.length && !opts.allowEmpty) return { ok: false, errors: ['Nothing approved to publish.'] };

      var today = formatDate_(new Date(), 'yyyy-MM-dd'), now = nowStamp_();
      var plan = [], conflicts = [];
      var work = {};
      Object.keys(tables).forEach(function (k) { work[k] = tables[k].map(function (r) { return JSON.parse(JSON.stringify(r)); }); });

      approved.forEach(function (q) {
        var type = q.record_type, t = ADMIN_TYPES_[type];
        if (!t) { conflicts.push(q.review_id + ': unknown record type ' + type); return; }
        var rows = work[type];
        var idx = -1;
        for (var i = 0; i < rows.length; i++) if (recordKey_(type, rows[i]) === q.record_id) { idx = i; break; }
        var proposed = q.proposed ? JSON.parse(q.proposed) : {};
        if (q.change_type === 'create') {
          if (idx >= 0) { conflicts.push(q.review_id + ': ' + q.record_id + ' already exists'); return; }
          var row = {};
          schemaFor_(type).columns.forEach(function (c) { row[c.name] = emptyFor_(c.kind); });
          Object.keys(proposed).forEach(function (k) { row[k] = proposed[k]; });
          applyWorkflowFields_(type, row, q, today, now, 1);
          row._new = true;
          rows.push(row);
          plan.push({ q: q, type: type, row: row, changed: Object.keys(row).filter(function (k) { return k.charAt(0) !== '_'; }) });
          return;
        }
        if (idx < 0) { conflicts.push(q.review_id + ': ' + q.record_id + ' no longer exists'); return; }
        var cur = rows[idx];
        if ((cur.version || 0) !== (q.record_version || 0)) {
          conflicts.push(q.review_id + ': ' + q.record_id + ' changed since it was proposed (version ' + q.record_version + ' → ' + cur.version + ')');
          return;
        }
        var changed = [];
        if (q.change_type === 'update') {
          Object.keys(proposed).forEach(function (k) {
            if (JSON.stringify(cur[k]) !== JSON.stringify(proposed[k])) { cur[k] = proposed[k]; changed.push(k); }
          });
        }
        if (q.change_type === 'archive') {
          cur.status = type === 'Calculators' ? 'unavailable' : 'archived';
          changed.push('status');
          if (cur.version !== undefined) { cur.version = (cur.version || 0) + 1; changed.push('version'); }
          if (cur.updated_at !== undefined) { cur.updated_at = now; cur.updated_by = q.requested_by; changed.push('updated_at', 'updated_by'); }
        } else {
          changed = changed.concat(applyWorkflowFields_(type, cur, q, today, now, (cur.version || 0) + 1));
        }
        plan.push({ q: q, type: type, row: cur, changed: changed.filter(function (k, i, a) { return a.indexOf(k) === i; }) });
      });

      if (conflicts.length) {
        return { ok: false, conflicts: conflicts, errors: ['Some approved changes conflict with the current Sheet. Ask the editor to re-propose them, then publish again.'] };
      }
      var check = validateTables_(work, input.errors);
      if (check.errors.length) return { ok: false, errors: check.errors.slice(0, 50), errorCount: check.errors.length };
      if (opts.dryRun) {
        return { ok: true, dryRun: true, changes: plan.length, warnings: check.warnings.slice(0, 30),
                 summary: plan.map(function (p) { return p.type + ' ' + recordKey_(p.type, p.row) + ' (' + p.q.change_type + ')'; }) };
      }

      // Write rows (only the changed cells of existing rows; new rows appended).
      plan.forEach(function (p) {
        var sh = ss.getSheetByName(p.type);
        if (p.row._new) {
          var o = {};
          schemaFor_(p.type).columns.forEach(function (c) { o[c.name] = toCell_(p.row[c.name], c.kind); });
          appendObjects_(sh, [sheetSafe_(o)]);
        } else {
          writeCells_(sh, p.type, p.row._row, p.row, p.changed);
        }
      });
      var stamp = nowStamp_();
      plan.forEach(function (p) {
        updateReviewRow_(ss, p.q.review_id, { review_status: 'published', published_at: stamp });
      });
      if (plan.some(function (p) { return p.type === 'Topics' && p.row._new; })) seedSections_(ss);
      invalidateTables_();
      var v = newContentVersion_();
      setContentVersion_(ss, v);
      // Publishing approved clinical content is a clinical sign-off: Home shows this date instead of "review pending".
      if (plan.some(function (p) { var d = schemaFor_(p.type); return d && d.clinical && p.q.change_type !== 'archive'; })) {
        setSetting_(ss, 'last_clinical_review', String(stamp).slice(0, 10));
      }
      plan.forEach(function (p) {
        logChange_(ss, p.q.change_type === 'archive' ? 'archive' : 'publish', p.type, recordKey_(p.type, p.row),
          'Published ' + p.q.change_type + ' (' + p.q.review_id + ', approved by ' + p.q.reviewer + '): ' + p.q.change_note,
          String(p.row.version || ''), v);
      });
      logChange_(ss, 'publish', 'Content', v, 'Published ' + plan.length + ' change(s) by ' + me.email, '', v);
      return { ok: true, contentVersion: v, published: plan.length, warnings: check.warnings.slice(0, 30) };
    } finally { lock.releaseLock(); }
  });
}

/** @param {string} email  @param {string} role '' removes the user */

/* ==========================================================================
 * Helpers
 * ======================================================================== */

/** Runs fn with auth, fresh reads, and a safe error shape for the browser. */
function adminCall_(role, fn) {
  var me;
  try { me = adminAuth_(role); }
  catch (e) { return { ok: false, denied: true, error: e.message }; }
  try {
    resetDataMemo_();
    var out = fn(me);
    if (out && out.ok === undefined) out.ok = true;
    return out;
  } catch (e) {
    console.error('admin error: ' + (e && e.stack ? e.stack : e));
    return { ok: false, error: String(e && e.message ? e.message : e).slice(0, 500) };
  }
}

function adminType_(type) {
  if (!Object.prototype.hasOwnProperty.call(ADMIN_TYPES_, type)) throw new Error('Unknown record type.');
  return ADMIN_TYPES_[type];
}

function recordKey_(type, row) {
  return ADMIN_TYPES_[type].key.map(function (k) { return String(row[k] === undefined || row[k] === null ? '' : row[k]); }).join('/');
}

function findRecord_(type, key) {
  var rows = readTable_(type);
  for (var i = 0; i < rows.length; i++) if (recordKey_(type, rows[i]) === String(key)) return rows[i];
  return null;
}

function topicOf_(type, current, proposed) {
  var t = ADMIN_TYPES_[type];
  if (!t.topic) return '';
  return String((proposed && proposed[t.topic]) || (current && current[t.topic]) || '');
}

/** Open proposals (pending / approved / changes requested) by record key. */
function openReviewsByKey_(type) {
  var map = {};
  readTable_('ReviewQueue').forEach(function (q) {
    if (q.record_type === type && ADMIN_OPEN_STATES_.indexOf(q.review_status) >= 0) map[q.record_id] = q;
  });
  return map;
}

/** Shape of a queue item for the browser, with a comparison against the live row. */
function reviewView_(q) {
  var current = ADMIN_TYPES_[q.record_type] ? findRecord_(q.record_type, q.record_id) : null;
  var proposed = {};
  try { proposed = q.proposed ? JSON.parse(q.proposed) : {}; } catch (e) { proposed = {}; }
  var diff = q.change_type === 'update' || q.change_type === 'create' ? diffFields_(q.record_type, current, proposed) : {};
  var stale = !!current && q.change_type !== 'create' && (current.version || 0) !== (q.record_version || 0);
  return {
    id: q.review_id, type: q.record_type, key: q.record_id, topic: q.topic_id, changeType: q.change_type || 'update',
    status: q.review_status, requestedBy: q.requested_by, requestedAt: q.requested_at, reviewer: q.reviewer,
    reviewedAt: q.reviewed_at, note: q.change_note, comments: q.comments, sourceChecked: !!q.source_checked,
    stale: stale, current: current ? adminPlain_(current) : null, diff: diff
  };
}

/** { field: {from, to} } for fields whose value differs. */
function diffFields_(type, current, proposed) {
  var out = {};
  Object.keys(proposed || {}).forEach(function (k) {
    var from = current ? current[k] : (Array.isArray(proposed[k]) ? [] : '');
    if (JSON.stringify(from === undefined ? '' : from) !== JSON.stringify(proposed[k])) out[k] = { from: from === undefined ? '' : from, to: proposed[k] };
  });
  return out;
}

function historyFor_(type, key, limit) {
  return readTable_('ChangeLog').filter(function (r) { return r.record_type === type && r.record_id === key; })
    .slice(-limit).reverse().map(function (r) { return adminPlain_(r); });
}

/**
 * Checks and normalises submitted fields against the schema. Workflow columns are
 * ignored. Key columns of an existing record cannot be changed.
 * @return {{values: Object, errors: string[]}}
 */
function checkFields_(type, fields, current) {
  var t = ADMIN_TYPES_[type], def = schemaFor_(type), values = {}, errors = [];
  var refs = {};
  def.columns.forEach(function (c) {
    if (t.workflow.indexOf(c.name) >= 0) return;
    if (current && t.key.indexOf(c.name) >= 0) { values[c.name] = current[c.name]; return; }
    var raw = Object.prototype.hasOwnProperty.call(fields, c.name) ? fields[c.name] : (current ? current[c.name] : '');
    var v, label = c.name;
    switch (c.kind) {
      case 'int':
        if (raw === '' || raw === null || raw === undefined) v = null;
        else if (!/^-?\d{1,9}$/.test(String(raw).trim())) { errors.push(label + ': whole number only'); return; }
        else v = Number(String(raw).trim());
        break;
      case 'bool':
        v = raw === true || String(raw).toUpperCase() === 'TRUE';
        break;

    var hdl = field(errs, 'hdl', input.hdl, { label: 'HDL-C', min: 5, max: 300, unit: 'mg/dL' });

  /* ---------------------------------------------------------- Serum urate */

  /** input: { value, unit: 'mg/dL'|'umol/L' }. Target <6 mg/dL (TRA 2026). */
  function urate(input) {
    var errs = {};
    var unit = input.unit === 'umol/L' ? 'umol/L' : 'mg/dL';
    var v = field(errs, 'value', input.value, unit === 'mg/dL'
      ? { label: 'Serum urate', min: 0.1, max: 30, unit: 'mg/dL' }
      : { label: 'Serum urate', min: 6, max: 1800, unit: 'µmol/L' });

   *  - without BMD (abridged p.5–6, BMD indications): age ≥60 and hip ≥1.5% or MOF ≥4.5% → send for BMD

    var mof = field(errs, 'mof', input.mof, { label: 'FRAX major osteoporotic fracture', min: 0, max: 100, unit: '%' });
    if (hip !== null && mof !== null && hip > mof) errs.hip = 'Hip fracture risk cannot be higher than major osteoporotic fracture risk.';
    if (mode === 'nobmd') {
      var age = field(errs, 'age', input.age, { label: 'Age', min: 40, max: 90, unit: 'years' });
      if (hasErrors(errs)) return fail(errs);
      var applies = age >= 60;
      return { ok: true, mode: mode, hip: hip, mof: mof, applies: applies, bmdIndicated: applies && (hip >= 1.5 || mof >= 4.5),
               hipMet: hip >= 1.5, mofMet: mof >= 4.5 };
    }
    var t = field(errs, 'tscore', input.tscore, { label: 'Lowest T-score', min: -6, max: 4 });

    if (t > -2.5 && t < -1.0 && fx === 'other') reasons.push('otherfx');

    else if (t > -2.5 && t < -1.0) level = 'moderate';

   *   men   50.0 kg + 2.3 kg per inch over 60 inches
   *   women 45.5 kg + 2.3 kg per inch over 60 inches

   * (152.4 cm), so shorter heights return valid:false instead of extrapolating.
   * TES 2568 p.96: obese patients use IBW for the L-T4 1.6 µg/kg/day dose; ltt4 = 1.6 × IBW, rounded to whole µg.

    ckdEpi2021: ckdEpi2021, ckdEpi2009Thai: ckdEpi2009Thai, thaiEgfr: thaiEgfr,

  /* ---------------------------------------------------------------- pieces */
  function stat(label, value, unit, tag, main) {
    return h('div', { class: 'calc-stat' + (main ? ' is-main' : '') },
      h('div', { class: 'cs-label' }, label),
      h('div', { class: 'cs-value' }, String(value), unit ? h('small', null, ' ' + unit) : null),
      tag ? h('div', { class: 'cs-tag' }, tag) : null);
  }
  function bigRow(items) { return h('div', { class: 'calc-stats' }, items); }
  function line(text) { return h('p', { class: 'calc-line', lang: 'th' }, text); }
  /** Interpretation block: what the result means, then what to do next. */
  function interp(meaning, next) {
    return h('div', { class: 'calc-interp', lang: 'th' },
      h('div', { class: 'ci-head' }, 'แปลผล'), h('ul', null, meaning.map(function (t) { return h('li', null, t); })),
      next && next.length ? h('div', { class: 'ci-head' }, 'ขั้นต่อไป') : null,
      next && next.length ? h('ul', null, next.map(function (t) { return h('li', null, t); })) : null);
  }

  function heatmap(g, a) {
    var G = ['G1', 'G2', 'G3a', 'G3b', 'G4', 'G5'], A = ['A1', 'A2', 'A3'];
    var head = h('tr', null, h('th', null, ''), A.map(function (x) { return h('th', { scope: 'col' }, x); }));
    var rows = G.map(function (gg) {
      return h('tr', null, h('th', { scope: 'row' }, gg), A.map(function (aa) {
        var on = gg === g && aa === a;
        return h('td', { class: 'hm risk-' + C.riskGA(gg, aa) + (on ? ' is-on' : ''), 'aria-label': gg + aa + ' ' + C.riskGA(gg, aa) + (on ? ' (this patient)' : '') }, on ? '●' : '');
      }));
    });
    return h('table', { class: 'calc-heatmap' }, h('caption', null, 'ตารางที่ 3 · แนวทางโรคไตไทย 2565'), h('thead', null, head), h('tbody', null, rows));
  }

  function markChoice(group, value) {
    Array.prototype.forEach.call(group.children, function (b) {
      var on = String(value !== null && b.dataset.v === value);
      b.setAttribute('aria-checked', on); b.setAttribute('aria-pressed', on);
    });
  }

  /* ---------------------------------------------------------------- render */
  /**
   * @param {Object} calc  bootstrap entry {calc_id, title, status, limitations}
   * @param {Object} opts  { onLink(topicId, itemId), compact }
   */
  function render(calc, opts) {
    opts = opts || {};
    var m = META[calc.calc_id];
    var root = h('div', { class: 'calc-panel', id: 'calc-' + calc.calc_id });
    if (!m || (calc.status !== 'published' && calc.status !== 'draft')) {
      root.appendChild(UI.notice('warn', 'Not available.', 'This calculator has not been signed off for use.'));
      return root;
    }
    var values = {}, touched = {}, inputs = {}, errEls = {}, wraps = {};
    if (calc.reconstructed) {
      root.appendChild(UI.notice('danger', 'RECONSTRUCTED.', 'สูตรนี้ไม่ได้มาจากเอกสารทางการ สร้างจากโค้ดเปิดที่คัดลอกเครื่องคำนวณทางการ ต้องเทียบผลกับเครื่องคำนวณทางการก่อนใช้'));
    }
    if (calc.status === 'draft') {
      root.appendChild(UI.notice('warn', 'DRAFT.', 'This calculator has not been clinically reviewed. Do not use it for patient care until it is published.'));
    }
    root.appendChild(h('p', { class: 'calc-intro', lang: 'th' }, m.intro));

    var form = h('form', { class: 'calc-form', autocomplete: 'off', onsubmit: function (e) { e.preventDefault(); } });
    var unitLabels = {};
    m.fields.forEach(function (f) {
      var id = 'cf-' + calc.calc_id + '-' + f.key, errId = id + '-err';
      var wrap = h('div', { class: 'calc-field' + (f.type === 'readings' || f.wide ? ' is-wide' : '') });
      wraps[f.key] = wrap;
      wrap.appendChild(h('label', { for: id }, f.label));
      var ctl;
      if (f.type === 'choice') {
        values[f.key] = f.default || '';
        ctl = h('div', { class: 'segmented' + (f.wide ? ' seg-wrap' : ''), role: 'radiogroup', 'aria-label': f.label, id: id });
        f.options.forEach(function (o) {
          var on = String(o.value === values[f.key]);
          ctl.appendChild(h('button', { type: 'button', role: 'radio', 'aria-checked': on, 'aria-pressed': on, dataset: { v: o.value },
            onclick: function () {
              values[f.key] = o.value; touched[f.key] = true;
              markChoice(ctl, o.value);
              update();
            } }, o.label));
        });
        inputs[f.key] = ctl;
      } else if (f.type === 'readings') {
        values[f.key] = '';
        ctl = h('textarea', { id: id, rows: '6', placeholder: f.placeholder || '', 'aria-describedby': errId, spellcheck: 'false',
          oninput: function () { values[f.key] = ctl.value; touched[f.key] = true; update(); } });
        inputs[f.key] = ctl;
      } else {
        values[f.key] = '';
        var input = h('input', { id: id, type: 'text', inputmode: 'decimal', placeholder: f.placeholder || '', 'aria-describedby': errId,
          oninput: function () { values[f.key] = input.value; touched[f.key] = true; update(); } });
        inputs[f.key] = input;
        var unitNode = null;
        if (f.units) {
          values[f.unitKey] = f.units[0].value;
          unitNode = h('div', { class: 'segmented seg-sm', role: 'group', 'aria-label': f.label + ' unit' });
          f.units.forEach(function (u, i) {
            unitNode.appendChild(h('button', { type: 'button', 'aria-pressed': String(i === 0), dataset: { v: u.value },
              onclick: function () {
                values[f.unitKey] = u.value;
                Array.prototype.forEach.call(unitNode.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === u.value)); });
                (unitLabels[f.unitKey] || []).forEach(function (el) { el.textContent = u.label; });
                update();
              } }, u.label));
          });
        } else if (f.unitLabelFrom) {
          unitNode = h('span', { class: 'calc-unit' }, '');
          (unitLabels[f.unitLabelFrom] = unitLabels[f.unitLabelFrom] || []).push(unitNode);
        } else if (f.unit) {
          unitNode = h('span', { class: 'calc-unit' }, f.unit);
        }
        ctl = h('div', { class: 'calc-input' }, input, unitNode);
      }
      wrap.appendChild(ctl);
      if (f.hint) wrap.appendChild(h('div', { class: 'calc-hint', lang: 'th' }, f.hint));
      errEls[f.key] = h('div', { class: 'calc-err', id: errId, role: 'alert' });
      wrap.appendChild(errEls[f.key]);
      form.appendChild(wrap);
    });
    // unit labels that follow another field's unit
    Object.keys(unitLabels).forEach(function (k) {
      var first = null;
      m.fields.forEach(function (f) { if (f.unitKey === k) first = f.units[0].label; });
      unitLabels[k].forEach(function (el) { el.textContent = first || ''; });
    });
    root.appendChild(form);

    var result = h('div', { class: 'calc-result', 'aria-live': 'polite' });
    root.appendChild(result);

    var resetBtn = h('button', { class: 'btn btn-sm', type: 'button', onclick: reset }, icon('refresh', 'ic-sm'), 'Reset');
    root.appendChild(h('div', { class: 'calc-actions' }, resetBtn,
      h('span', { class: 'calc-privacy' }, icon('shield', 'ic-sm'), 'ค่าที่กรอกอยู่ในเครื่องนี้เท่านั้น ไม่ถูกส่งหรือบันทึก')));

    // Notes, limitations, sources
    var info = h('details', { class: 'calc-info' + (opts.compact ? '' : ' is-open'), open: opts.compact ? null : true },
      h('summary', null, 'Limitations & sources'));
    info.appendChild(h('ul', { class: 'calc-notes', lang: 'th' }, m.notes.map(function (n) { return h('li', null, n); })));
    if (calc.limitations) info.appendChild(h('div', { class: 'calc-local' }, h('strong', null, 'หมายเหตุจากผู้ดูแลเนื้อหา: '), UI.md(calc.limitations)));
    info.appendChild(h('ul', { class: 'calc-sources' }, m.sources.map(function (s) {
      return h('li', null, UI.badge(s.region === 'thai' ? 'Thai' : 'International', s.region === 'thai' ? 'ok' : 'info'), ' ', s.label);

      if (r[0] > last) frag.appendChild(document.createTextNode(text.slice(last, r[0])));
      frag.appendChild(h('mark', null, text.slice(r[0], r[1])));
      last = r[1];
    });
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }

  function resultItem(r, hl, hlText) {
    var e = r.entry;
    var t = state.topicsById[e.topicId] || {};
    var iconName = RESULT_ICON[e.kind] || (e.kind === 'topic' ? t.icon : (state.sectionsByType[e.section] || {}).icon) || 'book';
    var meta = [];
    if (e.kind === 'topic') meta.push(e.sub);
    else if (e.kind === 'section') meta.push(e.sub);
    else if (e.kind === 'calculator') meta.push('Calculator' + (e.sub ? ' · ' + e.sub : ''));
    else {
      meta.push(e.kind === 'rec' ? (e.sectionLabel || 'Recommendation') : RESULT_KIND[e.kind]);
      if (e.sub) meta.push(e.sub);
    }
    var body = e.text || '';
    var head = String(e.title || '').replace(/…$/, '');
    if (head && body.indexOf(head) === 0) body = body.slice(head.length).replace(/^[\s·]+/, '');   // don't repeat the title
    var snip = (e.kind === 'rec' || e.kind === 'drug' || e.kind === 'algorithm' || e.kind === 'curated') && body
      ? CPGSearch.snippet(body, hlText, 170) : '';
    if (snip && normalize(snip) === normalize(e.title)) snip = '';
    return h('button', { class: 'list-item sr-item', type: 'button', onclick: function () { openResult(e); } },
      h('span', { class: 'li-icon acc-bg acc-' + (e.kind === 'calculator' ? 'blue' : (t.accent || 'teal')) }, icon(iconName)),
      h('span', { class: 'li-main' },
        h('span', { class: 'li-title sr-title' }, markText(e.title, hl)),
        h('span', { class: 'sr-meta' },
          e.isDraft ? UI.badge('DRAFT', 'draft') : null,
          h('span', null, markText(meta.filter(Boolean).join(' · '), hl))),
        snip ? h('span', { class: 'sr-snippet' }, markText(snip, hlText)) : null),
      icon('chevron-right', 'ic-sm'));
  }

  function renderSearchResults(container, query) {
    clear(container);
    var q = normalize(query);
    if (!q) return;
    var out = Search.engine.search(q);
    var hl = out.highlight;
    var hlText = hl;

    // Group by disease (ordered by each disease's best result); calculators last.
    var groups = [], byKey = {};
    out.results.forEach(function (r) {
      var key = r.entry.kind === 'calculator' ? '_calc' : r.entry.topicId;
      if (!byKey[key]) { byKey[key] = { key: key, items: [] }; groups.push(byKey[key]); }
      byKey[key].items.push(r);
    });
    groups.sort(function (a, b) { return (a.key === '_calc') - (b.key === '_calc'); });

    if (Search.status === 'loading') {
      container.appendChild(h('p', { class: 'subtle search-hint sr-loading' }, icon('refresh', 'ic-sm'), ' Loading clinical content for search…'));
    }
    if (out.partial && groups.length) {
      container.appendChild(h('p', { class: 'subtle search-hint' }, 'No result contains every word. Showing the closest matches.'));
    }

    groups.forEach(function (g) {
      var t = state.topicsById[g.key];
      var label = g.key === '_calc' ? 'Calculators' : (t ? t.abbreviation + ' · ' + t.title : g.key);
      var group = h('div', { class: 'result-group' }, h('h3', null, label, h('span', { class: 'sr-count' }, ' ' + g.items.length)));
      var list = h('div', { class: 'list' });
      g.items.slice(0, PER_GROUP).forEach(function (r) { list.appendChild(resultItem(r, hl, hlText)); });
      group.appendChild(list);
      if (g.items.length > PER_GROUP) {
        var more = h('button', { class: 'btn btn-ghost sr-more', type: 'button', onclick: function () {
          g.items.slice(PER_GROUP).forEach(function (r) { list.appendChild(resultItem(r, hl, hlText)); });
          more.remove();
        } }, 'Show ' + (g.items.length - PER_GROUP) + ' more in ' + (t ? t.abbreviation : 'this group'));
        group.appendChild(more);
      }
      container.appendChild(group);
    });

    if (!groups.length) {
      container.appendChild(UI.emptyState('search', 'No matches for “' + query.trim() + '”',
        Search.status === 'ready'
          ? 'Try a disease, drug, lab test or abbreviation, in Thai or English. Only published content is searchable' + (state.boot.previewDrafts ? ' (drafts included in preview mode).' : '.')
          : 'Only disease and section names are searchable until the clinical index loads.'));
    }
    if (Search.status === 'error' && Search.error !== 'offline') {
      container.appendChild(UI.notice('warn', 'Clinical search is unavailable right now.', Search.error + ' Disease and section names still work.'));
    }
  }

  function debounce(fn, ms) {
    var t = null;
    return function () { var a = arguments, self = this; clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms); };
  }

  /** Builds a search box bound to a results container. */
  function searchBox(opts) {
    var results = h('div', { class: 'search-results', 'aria-live': 'polite' });
    var wrap = h('div', { class: 'search-box' + (state.searchQuery ? ' has-value' : ''), role: 'search' });
    var input = h('input', {
      class: 'search-input', type: 'search', id: opts.id || 'q', autocomplete: 'off', autocapitalize: 'off',
      spellcheck: 'false', enterkeyhint: 'search', 'aria-label': 'Search',
      placeholder: 'Search disease, drug, condition, guideline…'
    });
    input.value = state.searchQuery || '';
    var run = debounce(function () {
      state.searchQuery = input.value;
      renderSearchResults(results, input.value);
      if (opts.onChange) opts.onChange(input.value);
    }, 120);
    input.addEventListener('input', function () {
      wrap.classList.toggle('has-value', !!input.value);
      run();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { input.value = ''; input.dispatchEvent(new Event('input')); }
      if (e.key === 'Enter') { var first = results.querySelector('.list-item'); if (first) first.click(); }
    });
    var clearBtn = h('button', {
      class: 'search-clear', type: 'button', 'aria-label': 'Clear search',
      onclick: function () { input.value = ''; input.dispatchEvent(new Event('input')); input.focus(); }
    }, icon('x'));
    wrap.appendChild(icon('search', 'ic-search'));
    wrap.appendChild(input);
    wrap.appendChild(clearBtn);
    if (state.searchQuery) renderSearchResults(results, state.searchQuery);
    // When the clinical index arrives, refresh whatever this box is showing.
    var onIndex = function () { if (document.body.contains(results) && input.value) renderSearchResults(results, input.value); };
    Search.listeners = Search.listeners.filter(function (fn) { return fn.box && document.body.contains(fn.box); });
    onIndex.box = wrap;
    Search.listeners.push(onIndex);
    input.addEventListener('focus', loadSearchIndex);
    return { box: wrap, input: input, results: results };
  }

  /* ---------------- Topic data: memory → sessionStorage → server ---------------- */
  var topicMemo = {};

  function topicCacheKey(version, topicId) { return 'cpg.cache.' + version + '.topic.' + topicId; }

  function sessionGet(key) {
    try { var raw = window.sessionStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function sessionSet(key, value) {
    try { window.sessionStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* quota or blocked: memory only */ }
  }

  /** Resolves with the topic payload; uses caches keyed by content version. */
  function loadTopic(topicId) {
    var ver = state.boot.contentVersion || '';
    var key = topicCacheKey(ver, topicId);
    if (topicMemo[key]) return Promise.resolve(topicMemo[key]);
    var stored = sessionGet(key);
    if (stored) { topicMemo[key] = stored; return Promise.resolve(stored); }
    if (!Server.available) {
      return Promise.resolve({ ok: true, setupRequired: true, offlinePreview: true, sections: [], recommendations: [], drugs: [], algorithms: [], references: [] });
    }
    return Server.call('getTopic', topicId, ver).then(function (res) {
      var k = topicCacheKey(res.contentVersion || ver, topicId);
      topicMemo[k] = res;
      if (!res.setupRequired) sessionSet(k, res);
      if (res.versionChanged) {
        // Content was published since this page loaded: refresh the menu data quietly.
        Server.call('getBootstrap').then(function (fresh) { applyNewBoot(fresh); renderNav(); }).catch(function () {});
      }
      return res;
    });
  }

        var on = toggleFavorite(t.topic_id);

      }

      h('div', { class: 'th-main' },
        h('div', { class: 'topic-kicker' }, h('span', { class: 'topic-abbr' }, t.abbreviation)),
        h('h1', null, t.title),

    var body = h('div', { class: 'topic-body', 'aria-busy': 'true' });

    body.appendChild(h('div', { class: 'sec-card card-pad' }, UI.skeletonRows(4, false)));
    body.appendChild(h('div', { class: 'sec-card card-pad', style: { 'margin-top': '14px' } }, UI.skeletonRows(3, false)));

    var routeAtStart = state.route;
    loadTopic(t.topic_id).then(function (data) {
      if (state.route !== routeAtStart) return; // user navigated away

  }

  function fillTopicMeta(meta, t, data) {
    var hasContent = data && ((data.sections || []).some(function (s) { return s.content || s.summary; }) || (data.recommendations || []).length);
    var anyDraft = data && ((data.sections || []).concat(data.recommendations || []).some(function (x) { return x.isDraft; }));
    if (data.setupRequired) meta.appendChild(UI.badge('Content database not connected', 'warn', 'alert'));
    else if (!hasContent) meta.appendChild(UI.badge('No reviewed content yet', 'warn', 'alert'));
    else if (anyDraft) meta.appendChild(UI.badge('Contains DRAFT content', 'draft', 'alert'));
    else if (t.last_reviewed) meta.appendChild(UI.badge('Last clinically reviewed ' + UI.formatDate(t.last_reviewed), 'ok', 'check'));
    else meta.appendChild(UI.badge('Reviewed content', 'ok', 'check'));
    meta.appendChild(UI.badge('Content ' + (state.boot.contentVersion || '—'), null, 'layers'));
    var gb = glossaryBtn(t.topic_id);
    if (gb) meta.appendChild(gb);
  }

  function buildTopicSections(root, body, t, data, initialSection) {
    state.formularyName = data.formularyName || state.boot.formularyName || '';
    state.formularyAsOf = data.formularyAsOf || state.boot.formularyAsOf || '';
    var refsById = {};
    (data.references || []).forEach(function (r) { refsById[r.source_id] = r; });
    var sectionByType = {};
    (data.sections || []).forEach(function (s) { sectionByType[s.section_type] = s; });

    // Standard nine sections, then any custom sections from the database.
    var list = (state.boot.sectionTypes || []).map(function (st) {
      var row = sectionByType[st.type];
      return { type: st.type, key: st.type, title: (row && row.title) || st.title, short: st.short, icon: st.icon, row: row || null };
    });
    (data.sections || []).filter(function (s) { return s.section_type === 'custom'; }).forEach(function (s) {
      list.splice(list.length - 1, 0, { type: 'custom', key: s.section_id, title: s.title, short: s.title, icon: 'book', row: s });
    });
    if (topicCalcs(t.topic_id).length) {
      list.splice(list.length - 1, 0, { type: 'calculators', key: 'calculators', title: 'Calculators', short: 'Calculators', icon: 'calculator', row: null });
    }

    if (data.setupRequired) {
      body.appendChild(UI.notice('warn', data.offlinePreview ? 'Preview without server.' : 'Content database not connected yet.',
        data.offlinePreview ? 'This copy runs without Apps Script, so no guideline content is loaded.'
                            : 'The app is running on its built-in menu. Content appears after the database is set up and reviewed content is published.'));
      body.appendChild(h('div', { style: { height: '12px' } }));
    }

    var nav = h('nav', { class: 'section-nav', 'aria-label': 'Sections' });
    var chips = h('div', { class: 'chip-row' });
    nav.appendChild(chips);
    var sentinel = h('div', { 'aria-hidden': 'true', style: { height: '1px' } });
    body.appendChild(sentinel);
    body.appendChild(nav);

    var secEls = {};
    list.forEach(function (s, i) {
      chips.appendChild(h('button', {
        class: 'chip' + (i === 0 ? ' is-active' : ''), type: 'button', dataset: { sec: s.key },
        onclick: function () { openSection(s.key, true); if (s.type !== 'custom' && s.type !== 'calculators') addRecent(t.topic_id, s.type); }
      }, s.short));

      var expanded = s.key === 'overview' || s.key === initialSection;
      var card = h('div', { class: 'sec-card' + (expanded ? '' : ' is-collapsed') });
      var bodyId = 'sec-body-' + s.key;
      var secFav = s.type === 'custom' || s.type === 'calculators' ? null : h('button', {
        class: 'icon-btn' + (isFavorite(t.topic_id, s.type) ? ' is-on' : ''), type: 'button',
        style: { width: '36px', height: '36px', 'box-shadow': 'none' },
        'aria-label': 'Favorite ' + s.title, 'aria-pressed': String(isFavorite(t.topic_id, s.type)),
        onclick: function (ev) {
          ev.stopPropagation();
          var on = toggleFavorite(t.topic_id, s.type);
          secFav.classList.toggle('is-on', on); secFav.setAttribute('aria-pressed', String(on));
        }
      }, icon('star', 'ic-sm'));
      var head = h('div', { class: 'sec-head', role: 'button', tabindex: '0', 'aria-expanded': String(expanded), 'aria-controls': bodyId },
        h('span', { class: 'sec-icon' }, icon(s.icon)),
        h('h2', null, s.title),
        s.row && s.row.isDraft && (s.row.summary || s.row.content) ? UI.badge('DRAFT', 'draft') : null,
        secFav,
        icon('chevron-down', 'chev'));
      function toggle() {
        var collapsed = card.classList.toggle('is-collapsed');
        head.setAttribute('aria-expanded', String(!collapsed));
      }
      head.addEventListener('click', toggle);
      head.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
      card.appendChild(head);
      var content;
      try { content = renderSectionContent(t, s, data, refsById); }
      catch (err) { console.error(err); content = UI.notice('danger', 'This section could not be displayed.', null); }
      card.appendChild(h('div', { class: 'sec-body', id: bodyId }, content));
      var sec = h('section', { class: 'sec sec-' + s.type, id: 'sec-' + s.key, dataset: { sec: s.key } }, card);
      secEls[s.key] = { el: sec, card: card, head: head };
      body.appendChild(sec);
    });

    body.appendChild(footerNote());

    function openSection(key, smooth) {
      var target = secEls[key];
      if (!target) return;
      target.card.classList.remove('is-collapsed');
      target.head.setAttribute('aria-expanded', 'true');
      setActiveChip(key);
      var y = target.el.getBoundingClientRect().top + window.pageYOffset - nav.offsetHeight - 8;
      window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
    }
    function setActiveChip(key) {
      Array.prototype.forEach.call(chips.children, function (c) {
        var on = c.dataset.sec === key;
        c.classList.toggle('is-active', on);
        if (on) {
          var left = c.offsetLeft - chips.clientWidth / 2 + c.clientWidth / 2;
          if (chips.scrollTo) chips.scrollTo({ left: left, behavior: 'smooth' }); else chips.scrollLeft = left;
        }
      });
    }
    if ('IntersectionObserver' in window) {
      var stuckObs = new IntersectionObserver(function (entries) { nav.classList.toggle('is-stuck', !entries[0].isIntersecting); });
      stuckObs.observe(sentinel);
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) setActiveChip(en.target.dataset.sec); });
      }, { rootMargin: '-80px 0px -65% 0px' });
      Object.keys(secEls).forEach(function (k) { spy.observe(secEls[k].el); });
      state.observers.push(stuckObs, spy);
    }
    if (initialSection && secEls[initialSection]) setTimeout(function () { openSection(initialSection, false); }, 30);
    var p = state.route.params || {};
    if (p.item || p.drug) setTimeout(function () { focusItem(p, data, refsById, secEls, nav); }, 80);
  }

  /** Scrolls to and briefly highlights the item a search result points at. */
  function focusItem(p, data, refsById, secEls, nav) {
    if (p.drug) {
      var d = (data.drugs || []).filter(function (x) { return x.drug_id === p.drug; })[0];

  /* ---------------- Section renderers (generic; Phase 4 adds rich drug/algorithm components) ---------------- */
  var REFERRAL_LEVELS = [

    { key: 'urgent', label: 'Urgent referral', kind: 'warn' },
    { key: 'routine', label: 'Routine specialist referral', kind: 'info' }

  function renderSectionContent(t, s, data, refsById) {
    if (s.type === 'calculators') return topicCalculators(t);

    var recs = (data.recommendations || []).filter(function (r) {
      return s.type === 'custom' ? r.section_id === row.section_id : r.section_type === s.type;
    });
    var extra = s.type === 'overview'
      ? (data.recommendations || []).filter(function (r) { return r.is_overview && r.section_type !== 'overview'; }) : [];

    if (row && row.isDraft && (row.summary || row.content)) wrap.appendChild(draftRibbon());
    if (row && row.summary) wrap.appendChild(h('div', { class: 'sec-summary' }, UI.md(row.summary)));
    if (row && row.content) wrap.appendChild(UI.md(row.content));

    var nothing = !(row && (row.summary || row.content)) && !recs.length && !extra.length;

    if (s.type === 'referral' && recs.length) {

      if (other.length) renderRecGroups(wrap, other, refsById, s);

    if (extra.length) wrap.appendChild(overviewGrid(extra, refsById));
    if ((s.type === 'overview' && (recs.length || extra.length)) || s.type === 'references') {
      var gh = gradeHelpButton(data);
      if (gh) wrap.appendChild(gh);
    }

    if (s.type === 'drugs' && (data.drugs || []).length) {
      nothing = false;
      wrap.appendChild(drugTable(data.drugs, refsById));
    }

    if (s.type === 'algorithm' && (data.algorithms || []).length) {
      nothing = false;
      wrap.appendChild(algorithmFlow(data.algorithms, refsById));

            h('div', { class: 'ref-title' }, r.url ? h('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer' }, r.guideline_title) : r.guideline_title),
            h('div', { class: 'ref-meta' },
              [r.organization, r.publication_year, r.edition_or_version, r.document_section].filter(Boolean).join(' · ')),
            h('div', { class: 'ref-badges' },
              r.region === 'thai' ? UI.badge('Thai guideline', 'info') : r.region === 'international' ? UI.badge('International · trend', 'warn') : null,
              r.evidence_grading_system ? UI.badge('Grading: ' + r.evidence_grading_system) : null,
              r.last_verified ? UI.badge('Verified ' + UI.formatDate(r.last_verified), 'ok', 'check') : UI.badge('Not verified', 'draft'))));
        });
        wrap.appendChild(rl);
      }
    }

    if (nothing) {
      wrap.appendChild(UI.notice(null, data.setupRequired ? 'Content not loaded yet.' : 'No reviewed content for this section yet.',
        s.type === 'overview'
          ? 'The 30-second summary for ' + t.title + ' will appear here once reviewed content is published.'
          : 'Only clinically reviewed, published content is shown, each item with its source.'));

    }
    return wrap;
  }

  function renderRecGroups(wrap, recs, refsById, s) {
    var groups = [], byName = {};
    recs.forEach(function (r) {
      var g = r.subsection || '';
      if (!byName[g]) { byName[g] = { name: g, items: [] }; groups.push(byName[g]); }
      byName[g].items.push(r);
    });
    groups.forEach(function (g) {
      if (g.name) wrap.appendChild(h('h3', { class: 'sub-head' }, g.name));
      renderWithComparisons(wrap, g.items, refsById, s);
    });
  }

  /** Recommendations sharing a comparison_key are shown side by side, labelled by source. */
  function renderWithComparisons(wrap, items, refsById, s) {
    var done = {};
    items.forEach(function (r) {
      if (done[r.recommendation_id]) return;
      var key = r.comparison_key;
      var same = key ? items.filter(function (x) { return x.comparison_key === key; }) : [r];
      if (same.length > 1) {
        var cmp = h('div', { class: 'compare' }, h('div', { class: 'compare-head' }, icon('layers', 'ic-sm'), ' Guidelines differ — compare sources'),
          h('div', { class: 'compare-note' }, 'รพ. ยึดแนวทางไทยเป็นหลัก ฉบับต่างประเทศใช้ดูแนวโน้มร่วม'));
        var grid = h('div', { class: 'compare-grid' });
        var isThai = function (x) { var id = String(x.source_id || '').split('|')[0].trim(); return refsById[id] && refsById[id].region === 'thai' ? 0 : 1; };
        same = same.slice().sort(function (a, b) { return isThai(a) - isThai(b); });   // Thai guidelines first (hospital policy)
        same.forEach(function (x) { done[x.recommendation_id] = true; grid.appendChild(recCard(x, refsById, s)); });
        cmp.appendChild(grid);
        wrap.appendChild(cmp);
      } else {
        done[r.recommendation_id] = true;
        wrap.appendChild(recCard(r, refsById, s));
      }

  }

  var STYLE_LABEL = { warning: 'Warning', red_flag: 'Red flag', pearl: 'Clinical pearl', key_point: 'Key point', target: 'Target' };
  var STYLE_ICON = { warning: 'alert', red_flag: 'alert', pearl: 'zap', key_point: 'check', target: 'target' };

  function recCard(r, refsById, s) {
    var style = r.display_style || 'standard';
    var fromOther = s && s.type === 'overview' && r.section_type !== 'overview' ? state.sectionsByType[r.section_type] : null;
    return h('article', { class: 'rec rec-' + style + (r.isDraft ? ' is-draft' : ''), id: s && s.type === 'overview' && r.section_type !== 'overview' ? null : 'item-' + r.recommendation_id },
      r.isDraft ? draftRibbon() : null,
      (STYLE_LABEL[style] || r.clinical_condition || fromOther) ? h('div', { class: 'rec-top' },
        STYLE_LABEL[style] ? h('span', { class: 'rec-kind' }, icon(STYLE_ICON[style], 'ic-sm'), STYLE_LABEL[style]) : null,
        r.clinical_condition ? h('span', { class: 'rec-cond' }, r.clinical_condition) : null,
        fromOther ? h('span', { class: 'rec-from' }, fromOther.short) : null) : null,
      h('div', { class: 'rec-text' }, gradify(UI.md(r.recommendation_text), r.source_id, refsById)),
      sourceLine(r.source_id, refsById, r));
  }

  function sourceLine(sourceId, refsById, r) {
    var ids = String(sourceId || '').split('|').map(function (x) { return x.trim(); }).filter(Boolean);
    var labels = ids.map(function (id) {
      var ref = refsById[id];
      return ref ? ref.organization + (ref.publication_year ? ' ' + ref.publication_year : '') : id;
    });
    return h('div', { class: 'rec-source' },
      icon('book', 'ic-sm'),
      h('span', null, labels.join(' · ') || 'No source'),
      r && r.source_location ? h('span', { class: 'subtle' }, ' · ' + r.source_location) : null,
      r && r.strength ? gradeChip('strength', r.strength, ids, refsById) : null,
      r && r.evidence_level ? gradeChip('evidence', r.evidence_level, ids, refsById) : null,
      regionBadge(ids, refsById),
      r ? checkBadge(r.source_check) : null);
  }

  /** Thai vs international source label, so guidelines are never mixed silently. */
  function regionBadge(ids, refsById) {
    var regions = {};
    ids.forEach(function (id) { var ref = refsById[id]; if (ref && ref.region) regions[ref.region] = true; });
    if (regions.international && !regions.thai) return UI.badge('International · trend', 'warn');
    if (regions.thai && !regions.international) return UI.badge('Thai guideline', 'info');
    if (regions.thai && regions.international) return UI.badge('Thai + International', 'warn');

  function checkBadge(sc) {
    return sc === 'checked_against_source' ? UI.badge('Checked against source text', 'ok', 'check')
                                           : UI.badge('Needs source check', 'draft', 'alert');
  }

  /* ---------------- Quick Overview: key points from other sections, grouped ---------------- */
  var OVERVIEW_ORDER = ['diagnosis', 'target', 'algorithm', 'drugs', 'monitoring', 'referral', 'special'];
  var OVERVIEW_LABEL = { diagnosis: 'Diagnosis', target: 'Target', algorithm: 'Treatment', drugs: 'Drugs',
                         monitoring: 'Monitoring', referral: 'Refer when', special: 'Special situations', custom: 'More' };

  function overviewGrid(recs, refsById) {
    var grid = h('div', { class: 'ov-grid' });
    OVERVIEW_ORDER.concat(['custom']).forEach(function (type) {
      var items = recs.filter(function (r) { return (OVERVIEW_ORDER.indexOf(r.section_type) >= 0 ? r.section_type : 'custom') === type; });
      if (!items.length) return;
      var meta = state.sectionsByType[type] || { icon: 'book' };
      var tile = h('div', { class: 'ov-tile' },
        h('div', { class: 'ov-head' }, h('span', { class: 'sec-icon ov-icon' }, icon(meta.icon, 'ic-sm')), OVERVIEW_LABEL[type]));
      items.forEach(function (r) {
        tile.appendChild(h('div', { class: 'ov-item ov-' + (r.display_style || 'standard') + (r.isDraft ? ' is-draft' : '') },
          r.isDraft ? UI.badge('DRAFT', 'draft') : null,
          r.clinical_condition ? h('span', { class: 'rec-cond' }, r.clinical_condition) : null,
          gradify(UI.md(r.recommendation_text), r.source_id, refsById),
          h('div', { class: 'ov-src' }, sourceLabel(r.source_id, refsById),
            r.source_check !== 'checked_against_source' ? h('span', { class: 'ov-flag' }, ' · needs source check') : null)));
      });
      grid.appendChild(tile);
    });
    return grid;
  }

  function sourceLabel(sourceId, refsById) {
    return String(sourceId || '').split('|').map(function (x) { return x.trim(); }).filter(Boolean).map(function (id) {
      var ref = refsById[id];
      return ref ? ref.organization + (ref.publication_year ? ' ' + ref.publication_year : '') : id;

  /* ---------------- Drug guide: searchable table + detail panel ---------------- */
  function firstLine(text) {
    var t = String(text || '').split('\n').map(function (x) { return x.replace(/^[-*•]\s+/, '').trim(); }).filter(Boolean)[0] || '';
    return t.length > 70 ? t.slice(0, 68) + '…' : t;
  }

  /** Payment group label (from the server's PAYMENT_GROUPS_) and chip for a hospital item. */
  function payLabel(key) {
    var g = ((state.boot && state.boot.paymentGroups) || []).filter(function (x) { return x.key === key; })[0];

  }

  /** HOSxP drug-name colours of the hospital (server HOSXP_COLORS_). */
  function hxInfo(key) {

  function hxChip(key) {

  function legendBtn(label) {

  /** Tap-to-explain sheet: hospital colour legend, then ED / NED / เบิกได้ / จ2 / OCPA / list classes … */
  function openFormularyLegend() {
    var cols = (state.boot && state.boot.hosxpColors) || [], terms = (state.boot && state.boot.formularyTerms) || [];
    var body = h('div', { class: 'sheet-body hx-legend', lang: 'th' });

      return h('li', null, h('span', { class: 'hx-swatch hx-' + c.key, 'aria-hidden': 'true' }),

  /* Inline grades written inside the text, e.g. (I, A) · [1, ++] · [++, I, A] · (2, B) · (มีเงื่อนไข; ต่ำ; 98%) · (ปานกลาง · อย่างยิ่ง).
     Each becomes a tap target that opens the grade legend of that item's own source(s). */
  var GRADE_TOKEN = /^(?:I|IIa|IIb|III|A|B|C|D|[1-4]|2a|2b|\+\+|\+|-|--|\+\/-|B-R|B-NR|C-LD|C-EO|Not Graded|Not graded|ดี|สูง|ปานกลาง|ต่ำ|ต่ำมาก|อย่างยิ่ง|มีเงื่อนไข|แนะนำอย่างยิ่ง|แนะนำแบบมีเงื่อนไข|(?:สูง|ปานกลาง|ต่ำ|ต่ำมาก)[–-](?:สูง|ปานกลาง|ต่ำ|ต่ำมาก)|\d{1,3}%)$/;

    var refs = ids.map(function (id) { return refsById[id]; }).filter(function (r) { return r && r.grading_legend; });
    if (!refs.length) return root;
    function chip(text, codes) {

  /* ---------------- Abbreviations: tap a word to see its full term (0.11.1) ---------------- */
  var abbrCache = { key: null, re: null, map: null };

  /* ---------------- Algorithm: vertical flowchart from parent/next links ---------------- */
  var STEP_LABEL = { start: 'Start', decision: 'Decision', action: 'Action', end: 'Outcome', note: 'Note' };

  function algorithmFlow(steps, refsById) {
    var wrap = h('div', { class: 'flows' });
    var byAlg = {}, order = [];
    steps.forEach(function (s) { if (!byAlg[s.algorithm_id]) { byAlg[s.algorithm_id] = []; order.push(s.algorithm_id); } byAlg[s.algorithm_id].push(s); });
    order.forEach(function (id) {
      var list = byAlg[id];
      var byStep = {}, children = {};
      list.forEach(function (s) { byStep[s.step_id] = s; });
      list.forEach(function (s) {
        if (s.parent_step_id && byStep[s.parent_step_id]) (children[s.parent_step_id] = children[s.parent_step_id] || []).push(s);
      });
      var roots = list.filter(function (s) { return s.step_type === 'start'; });
      if (!roots.length) roots = list.filter(function (s) { return !s.parent_step_id || !byStep[s.parent_step_id]; });
      var seen = {};
      var flow = h('div', { class: 'flow', role: 'list', 'aria-label': 'Treatment algorithm', id: 'item-alg-' + id });
      roots.forEach(function (r) { flow.appendChild(flowNode(r, children, byStep, seen, refsById, 0)); });
      // Any orphan steps not reached from a root (shown so nothing is hidden)
      list.forEach(function (s) { if (!seen[s.step_id]) flow.appendChild(flowNode(s, children, byStep, seen, refsById, 0)); });
      wrap.appendChild(flow);
      var srcs = {};
      var locs = {};
      list.forEach(function (s) { srcs[sourceLabel(s.source_id, refsById)] = true; if (s.source_location) locs[s.source_location] = true; });
      var allChecked = list.every(function (x) { return x.source_check === 'checked_against_source'; });
      wrap.appendChild(h('div', { class: 'rec-source' }, icon('book', 'ic-sm'), h('span', null, Object.keys(srcs).join(' · ')),
        Object.keys(locs).length ? h('span', { class: 'subtle' }, ' · ' + Object.keys(locs).join('; ')) : null,
        regionBadge(list.map(function (x) { return x.source_id; }), refsById), checkBadge(allChecked ? 'checked_against_source' : '')));
    });
    return wrap;
  }

  function flowNode(step, children, byStep, seen, refsById, depth) {
    seen[step.step_id] = true;
    var node = h('div', { class: 'flow-step', role: 'listitem' },
      step.condition && depth > 0 ? h('div', { class: 'flow-edge' }, h('span', null, step.condition)) : h('div', { class: 'flow-edge flow-edge-plain' }),
      h('div', { class: 'flow-node node-' + step.step_type + (step.isDraft ? ' is-draft' : '') },
        h('span', { class: 'node-kind' }, STEP_LABEL[step.step_type] || step.step_type, step.isDraft ? ' · DRAFT' : '',
          step.source_check !== 'checked_against_source' ? ' · needs source check' : ''),
        gradify(UI.md(step.action), step.source_id, refsById),
        (step.next_step_id || []).filter(function (n) { return byStep[n] && byStep[n].parent_step_id !== step.step_id; }).length
          ? h('div', { class: 'flow-goto' }, '→ ', (step.next_step_id || []).filter(function (n) { return byStep[n]; }).map(function (n) {
              return firstLine(byStep[n].action);
            }).join(' / ')) : null));
    if (depth > 40) return node;
    var kids = (children[step.step_id] || []).filter(function (c) { return !seen[c.step_id]; })
      .sort(function (a, b) { return (a.display_order || 0) - (b.display_order || 0); });
    if (kids.length === 1) {
      node.appendChild(flowNode(kids[0], children, byStep, seen, refsById, depth + 1));
    } else if (kids.length > 1) {
      var branches = h('div', { class: 'flow-branches' });
      kids.forEach(function (k) { branches.appendChild(h('div', { class: 'flow-branch' }, flowNode(k, children, byStep, seen, refsById, depth + 1))); });
      node.appendChild(branches);
    }
    return node;
  }

      renderNav(); return;

    try {
      (VIEWS[state.route.name] || viewHome)(view);

  function applyNewBoot(fresh) {
    if (!fresh || !fresh.ok) return;
    var versionChanged = fresh.contentVersion !== state.boot.contentVersion;
    state.boot = fresh;
    indexBoot();
    if (versionChanged) { Search.clinical = []; Search.status = 'idle'; }
    buildShellIndex();
    checkContentVersion();
  }

  function checkContentVersion() {
    var current = state.boot.contentVersion;
    var seen = Store.get(KEYS.contentVersion, null);
    if (seen && current && seen !== current) {
      Store.clearContentCache();
      UI.toast('Guideline content updated');
    }
    if (current) Store.set(KEYS.contentVersion, current);
  }

  function reloadBoot() {
    var view = clear(document.getElementById('view'));
    view.appendChild(h('div', { class: 'boot-loading' }, h('div', { class: 'spinner' }), h('p', null, 'Reconnecting…')));
    Server.call('getBootstrap').then(function (fresh) { applyNewBoot(fresh); render({ scrollTop: true }); })
      .catch(function (err) { state.boot = { ok: false, error: err.message }; render({}); });
  }

  /* ------------------------------------------------------------------------
   * 13. Start
   * ---------------------------------------------------------------------- */
  function start() {
    applyTheme(getTheme());
    installAbbr();
    if (state.boot.ok) { indexBoot(); buildShellIndex(); checkContentVersion(); }
    render({ scrollTop: false });
    // Load the clinical search index in the background after first paint.
    if (state.boot.ok) setTimeout(loadSearchIndex, 400);

    window.addEventListener('online', function () { state.online = true; renderBanners(); UI.toast('Back online'); });
    window.addEventListener('offline', function () { state.online = false; renderBanners(); });
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function () { if (getTheme() === 'system') renderThemeButtons(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }
    // Keyboard shortcut: "/" focuses search (desktop).
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !/input|textarea/i.test((document.activeElement || {}).tagName || '')) {
        e.preventDefault();
        var box = document.querySelector('.search-input');
        if (box) box.focus(); else navigate('search');
      }
    });
  }

  // Expose a tiny read-only hook for tests and later phases.
  window.CPG = { navigate: navigate, state: state, Store: Store, Server: Server, Search: Search,
                 searchShell: function (q) { return searchShell(q); }, loadSearchIndex: loadSearchIndex };

  initRouter(start);
})();
</script>
