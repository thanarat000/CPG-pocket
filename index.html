/**
 * CPG Pocket — DataService.gs
 * Google Sheets access: header-based reading, type normalisation, visibility rules.
 * All functions are private (trailing "_"): the browser cannot call them.
 */

var PROP_SPREADSHEET_ID_ = 'SPREADSHEET_ID';
var PROP_CONTENT_VERSION_ = 'CONTENT_VERSION';

/** Per-execution memo so one request never reads the same sheet twice. */
var DS_MEMO_ = {};

/** Thrown when no database is connected yet (before setupDatabase()). */
function NotConfiguredError_(message) {
  this.name = 'NotConfiguredError';
  this.message = message;
}
NotConfiguredError_.prototype = Object.create(Error.prototype);

/**
 * Returns the content spreadsheet: the ID stored in Script Properties by
 * setupDatabase(), or the container Sheet for a bound project.
 * @return {GoogleAppsScript.Spreadsheet.Spreadsheet}
 */
function getDb_() {
  if (DS_MEMO_.db) return DS_MEMO_.db;
  var id = PropertiesService.getScriptProperties().getProperty(PROP_SPREADSHEET_ID_);
  var ss = null;
  if (id) {
    ss = SpreadsheetApp.openById(id);
  } else {
    try { ss = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { ss = null; }
  }
  if (!ss) throw new NotConfiguredError_('No content database connected. Run setupDatabase() from the Apps Script editor.');
  DS_MEMO_.db = ss;
  return ss;
}

/** @return {boolean} true once setupDatabase() has stored the spreadsheet ID. */
function isDbConfigured_() {
  return !!PropertiesService.getScriptProperties().getProperty(PROP_SPREADSHEET_ID_);
}

/**
 * Reads a sheet into an array of plain objects keyed by header name.
 * Unknown/extra columns are ignored; missing columns read as ''.
 * Rows whose first schema column is blank are skipped.
 * @param {string} sheetName
 * @return {Object[]}
 */
function readTable_(sheetName) {
  var memoKey = 'table:' + sheetName;
  if (DS_MEMO_[memoKey]) return DS_MEMO_[memoKey];

  var schema = schemaFor_(sheetName);
  if (!schema) throw new Error('readTable_: unknown sheet ' + sheetName);
  var sh = getDb_().getSheetByName(sheetName);
  if (!sh) { DS_MEMO_[memoKey] = []; return []; }

  var values = sh.getDataRange().getValues();
  if (values.length < 2) { DS_MEMO_[memoKey] = []; return []; }

  var headers = values[0].map(function (h) { return String(h).trim(); });
  var colIndex = {};
  headers.forEach(function (h, i) { if (h && colIndex[h] === undefined) colIndex[h] = i; });
  var firstCol = schema.columns[0].name;

  var rows = [];
  for (var r = 1; r < values.length; r++) {
    var raw = values[r];
    var obj = { _row: r + 1 };
    schema.columns.forEach(function (col) {
      var i = colIndex[col.name];
      obj[col.name] = normaliseCell_(i === undefined ? '' : raw[i], col.kind);
    });
    if (obj[firstCol] === '' || obj[firstCol] === null) continue;
    rows.push(obj);
  }
  DS_MEMO_[memoKey] = rows;
  return rows;
}

/**
 * Converts a raw cell value to a predictable JS value by field kind.
 * @param {*} v
 * @param {string} kind
 * @return {*}
 */
function normaliseCell_(v, kind) {
  if (v === null || v === undefined) v = '';
  switch (kind) {
    case 'int':
      if (v === '') return null;
      var n = Number(v);
      return isFinite(n) ? Math.round(n) : null;
    case 'bool':
      return v === true || String(v).trim().toUpperCase() === 'TRUE';
    case 'date':
      if (v instanceof Date) return formatDate_(v, 'yyyy-MM-dd');
      return String(v).trim();
    case 'datetime':
      if (v instanceof Date) return formatDate_(v, "yyyy-MM-dd'T'HH:mm:ssXXX");
      return String(v).trim();
    case 'list':
      return splitList_(v);
    case 'enum':
      return String(v).trim().toLowerCase();
    default:
      if (v instanceof Date) return formatDate_(v, 'yyyy-MM-dd');
      return String(v).trim();
  }
}

/** "a | b|c" → ['a','b','c'] */
function splitList_(v) {
  if (Array.isArray(v)) return v;
  var s = String(v === null || v === undefined ? '' : v).trim();
  if (!s) return [];
  return s.split('|').map(function (x) { return x.trim(); }).filter(function (x) { return x !== ''; });
}

function formatDate_(d, pattern) {
  return Utilities.formatDate(d, APP_CONFIG.TIME_ZONE, pattern);
}

/** @return {Object<string,string>} AppSettings as a key → value map. */
function readSettings_() {
  if (DS_MEMO_.settings) return DS_MEMO_.settings;
  var map = {};
  readTable_('AppSettings').forEach(function (r) { map[r.setting_key] = r.setting_value; });
  DS_MEMO_.settings = map;
  return map;
}

/** @return {boolean} */
function settingBool_(settings, key) {
  return String(settings[key] || '').trim().toUpperCase() === 'TRUE';
}

/**
 * Visibility rule (defence in depth; validateDatabase enforces the same rule).
 *  - archived: never shown
 *  - published: shown; clinical rows also need last_reviewed AND reviewer
 *  - draft / in_review / reviewed: shown only when preview_drafts is TRUE, flagged isDraft
 * @param {Object} row
 * @param {boolean} clinical
 * @param {boolean} previewDrafts
 * @return {{visible: boolean, isDraft: boolean}}
 */
function visibility_(row, clinical, previewDrafts) {
  var status = row.status || 'draft';
  if (status === 'archived') return { visible: false, isDraft: false };
  var reviewedOk = !clinical || (!!row.last_reviewed && !!row.reviewer);
  if (status === 'published' && reviewedOk) return { visible: true, isDraft: false };
  if (previewDrafts) return { visible: true, isDraft: true };
  return { visible: false, isDraft: false };
}

/**
 * Current content version. Script Properties is the fast, authoritative copy;
 * AppSettings.content_version mirrors it for humans.
 * @return {string}
 */
function getContentVersion_() {
  var v = PropertiesService.getScriptProperties().getProperty(PROP_CONTENT_VERSION_);
  return v || APP_CONFIG.DEFAULT_CONTENT_VERSION;
}

/** Clears the per-execution memo (used after writes in Setup/Admin). */
function resetDataMemo_() {
  DS_MEMO_ = {};
}

/** Drops memoised table reads but keeps the open spreadsheet handle. */
function invalidateTables_() {
  var db = DS_MEMO_.db;
  DS_MEMO_ = {};
  if (db) DS_MEMO_.db = db;
}

/**
 * CPG Pocket — CacheLayer.gs
 * Versioned, chunked wrapper around CacheService (script cache).
 *
 * Keys look like  cpg:<contentVersion>:<name>
 * Publishing bumps contentVersion, so old entries are simply never read again
 * and expire after CACHE_TTL_SECONDS. CacheService values are limited to 100 KB (UTF-8 bytes),
 * so larger JSON payloads are split into chunks of CHUNK_SIZE_ characters. Thai text is 3 bytes per
 * character, so 25,000 characters stay under the limit even with the JSON escaping of the header.
 */

var CHUNK_SIZE_ = 25000;
var MAX_CHUNKS_ = 120;  // ~3 M characters safety ceiling

function cacheKey_(name) {
  return APP_CONFIG.CACHE_PREFIX + ':' + getContentVersion_() + ':' + name;
}

/**
 * @param {string} name
 * @return {*} parsed value, or null on miss / corruption
 */
function cacheGet_(name) {
  try {
    var cache = CacheService.getScriptCache();
    var key = cacheKey_(name);
    var head = cache.get(key);
    if (!head) return null;
    var meta = JSON.parse(head);
    if (!meta || typeof meta.n !== 'number') return null;
    if (meta.n === 0) return JSON.parse(meta.v);
    var keys = [];
    for (var i = 0; i < meta.n; i++) keys.push(key + ':' + i);
    var parts = cache.getAll(keys);
    var json = '';
    for (var j = 0; j < meta.n; j++) {
      var part = parts[key + ':' + j];
      if (part === undefined || part === null) return null; // a chunk was evicted
      json += part;
    }
    return JSON.parse(json);
  } catch (e) {
    console.warn('cacheGet_ ' + name + ': ' + e);
    return null;
  }
}

/**
 * @param {string} name
 * @param {*} value JSON-serialisable
 * @return {boolean} true if stored
 */
function cachePut_(name, value) {
  try {
    var cache = CacheService.getScriptCache();
    var key = cacheKey_(name);
    var json = JSON.stringify(value);
    var ttl = APP_CONFIG.CACHE_TTL_SECONDS;
    if (json.length <= CHUNK_SIZE_) {
      cache.put(key, JSON.stringify({ n: 0, v: json }), ttl);
      return true;
    }
    var n = Math.ceil(json.length / CHUNK_SIZE_);
    if (n > MAX_CHUNKS_) { console.warn('cachePut_ ' + name + ': too large (' + json.length + ' chars)'); return false; }
    var entries = {};
    for (var i = 0; i < n; i++) entries[key + ':' + i] = json.substr(i * CHUNK_SIZE_, CHUNK_SIZE_);
    cache.putAll(entries, ttl);
    cache.put(key, JSON.stringify({ n: n }), ttl); // header last: readers never see a partial set
    return true;
  } catch (e) {
    console.warn('cachePut_ ' + name + ': ' + e);
    return false;
  }
}

/**
 * Returns the cached value or computes, caches and returns it.
 * @param {string} name
 * @param {function(): *} compute
 * @return {*}
 */
function cached_(name, compute) {
  var hit = cacheGet_(name);
  if (hit !== null) return hit;
  var value = compute();
  cachePut_(name, value);
  return value;
}

/**
 * CPG Pocket — ContentService.gs
 * Builds the payloads sent to the browser from the Google Sheet.
 * Only visible rows leave the server (see visibility_ in DataService.gs).
 * Reviewer emails and audit columns are never sent to the browser.
 */

var TOPIC_ID_PATTERN_ = /^[A-Z][A-Z0-9_]{1,15}$/;

/**
 * Browser-callable: everything needed to render one disease module, in one call.
 * @param {string} topicId
 * @param {string=} clientVersion content version the browser has cached
 * @return {Object}
 */
function getTopic(topicId, clientVersion) {
  return withErrorBoundary_('getTopic', function () {
    topicId = String(topicId || '').toUpperCase();
    if (!TOPIC_ID_PATTERN_.test(topicId)) return { ok: false, error: 'Invalid topic.' };
    if (!isDbConfigured_()) {
      return { ok: true, setupRequired: true, contentVersion: getContentVersion_(), topicId: topicId,
               sections: [], recommendations: [], drugs: [], algorithms: [], references: [] };
    }
    var payload = cached_('topic:' + topicId, function () { return buildTopicPayload_(topicId); });
    if (!payload) return { ok: false, error: 'Topic not found or not published.' };
    payload.contentVersion = getContentVersion_();
    payload.versionChanged = !!clientVersion && clientVersion !== payload.contentVersion;
    return payload;
  });
}

/**
 * Bootstrap built from the Sheet (cached per content version).
 * @return {Object}
 */
function buildSheetBootstrap_() {
  var data = cached_('bootstrap', function () {
    var settings = readSettings_();
    var preview = settingBool_(settings, 'preview_drafts');

    var sections = readTable_('Sections');
    var recs = readTable_('Recommendations');
    var contentCount = {};
    sections.forEach(function (s) {
      if (visibility_(s, true, preview).visible && (s.content || s.summary)) contentCount[s.topic_id] = (contentCount[s.topic_id] || 0) + 1;
    });
    recs.forEach(function (r) {
      if (visibility_(r, true, preview).visible) contentCount[r.topic_id] = (contentCount[r.topic_id] || 0) + 1;
    });

    var topics = readTable_('Topics')
      .filter(function (t) { return visibility_(t, false, preview).visible; })
      .map(function (t) {
        var out = sanitizeTopic_(t);
        out.hasContent = (contentCount[t.topic_id] || 0) > 0;
        out.isDraft = t.status !== 'published';
        return out;
      })
      .sort(function (a, b) { return a.display_order - b.display_order; });

    return {
      appName: settings.app_name || APP_CONFIG.APP_NAME,
      lastClinicalReview: settings.last_clinical_review || null,
      previewDrafts: preview,
      maintenanceMessage: settings.maintenance_message || '',
      formularyName: settings.formulary_name || '',
      formularyAsOf: settings.formulary_as_of || '',
      topics: topics,
      calculators: mergeCalculatorRegistry_(readTable_('Calculators'), preview)
    };
  });

  return {
    ok: true,
    appName: data.appName,
    appSubtitle: APP_CONFIG.APP_SUBTITLE,
    codeVersion: APP_CONFIG.CODE_VERSION,
    schemaVersion: APP_CONFIG.SCHEMA_VERSION,
    contentVersion: getContentVersion_(),
    dataSource: 'sheet',
    setupRequired: false,
    lastClinicalReview: data.lastClinicalReview,
    previewDrafts: data.previewDrafts,
    maintenanceMessage: data.maintenanceMessage,
    sectionTypes: SECTION_TYPES,
    paymentGroups: PAYMENT_GROUPS_,
    hosxpColors: HOSXP_COLORS_,
    formularyTerms: FORMULARY_TERMS_,
    glossary: glossaryForClient_(),
    topics: data.topics,
    calculators: data.calculators,
    serverTime: formatDate_(new Date(), "yyyy-MM-dd'T'HH:mm:ssXXX")
  };
}

/**
 * A calculator is usable only when the code marks it 'verified' (equation checked,
 * test vectors pass) AND the Calculators sheet signs it off:
 *   sheet 'published'                    → status 'published'
 *   sheet 'draft' and preview_drafts on  → status 'draft' (shown with a DRAFT warning)
 *   anything else                        → status 'unavailable'
 * @param {Object[]} sheetRows
 * @param {boolean} preview
 * @return {Object[]}
 */
function mergeCalculatorRegistry_(sheetRows, preview) {
  var bySheet = {};
  sheetRows.forEach(function (r) { bySheet[r.calc_id] = r; });
  return CALCULATOR_REGISTRY.map(function (c) {
    var s = bySheet[c.calc_id];
    var status = 'unavailable';
    if ((c.status === 'verified' || c.status === 'reconstructed') && s) {
      if (s.status === 'published') status = 'published';
      else if (s.status === 'draft' && preview) status = 'draft';
    }
    return {
      calc_id: c.calc_id,
      title: (s && s.title) || c.title,
      topic_ids: (s && s.topic_ids && s.topic_ids.length ? s.topic_ids : c.topic_ids),
      status: status,
      limitations: status !== 'unavailable' && s ? (s.limitations || '') : '',
      reconstructed: c.status === 'reconstructed'
    };
  });
}

/**
 * @param {string} topicId
 * @return {Object|null} null when the topic is missing or hidden
 */
function buildTopicPayload_(topicId) {
  var settings = readSettings_();
  var preview = settingBool_(settings, 'preview_drafts');

  var topicRow = readTable_('Topics').filter(function (t) { return t.topic_id === topicId; })[0];
  if (!topicRow || !visibility_(topicRow, false, preview).visible) return null;

  // Sections (all rows give the id → type map; only visible rows send content).
  var sectionTypeById = {};
  var sections = [];
  readTable_('Sections').forEach(function (s) {
    if (s.topic_id !== topicId) return;
    sectionTypeById[s.section_id] = s.section_type;
    var vis = visibility_(s, true, preview);
    if (!vis.visible) return;
    sections.push({
      section_id: s.section_id, section_type: s.section_type, title: s.title,
      summary: s.summary, content: s.content, display_order: s.display_order || 0,
      last_reviewed: s.last_reviewed || null, isDraft: vis.isDraft
    });
  });
  sections.sort(byOrder_);

  var sourceIds = {};
  function useSource(id) { splitList_(id).forEach(function (x) { sourceIds[x] = true; }); }

  var recommendations = [];
  readTable_('Recommendations').forEach(function (r) {
    if (r.topic_id !== topicId) return;
    var vis = visibility_(r, true, preview);
    if (!vis.visible) return;
    useSource(r.source_id);
    recommendations.push({
      recommendation_id: r.recommendation_id, section_id: r.section_id,
      section_type: sectionTypeById[r.section_id] || 'custom',
      subsection: r.subsection, clinical_condition: r.clinical_condition,
      recommendation_text: r.recommendation_text, display_style: r.display_style || 'standard',
      referral_level: r.referral_level, comparison_key: r.comparison_key,
      strength: r.strength, evidence_level: r.evidence_level,
      source_id: r.source_id, source_location: r.source_location, source_check: r.source_check || 'needs_source_check',
      is_overview: r.is_overview, display_order: r.display_order || 0,
      last_reviewed: r.last_reviewed || null, isDraft: vis.isDraft
    });
  });
  recommendations.sort(byOrder_);

  // Drugs linked through TopicDrugs.
  var links = readTable_('TopicDrugs').filter(function (l) { return l.topic_id === topicId; });
  var drugById = {};
  readTable_('Drugs').forEach(function (d) { drugById[d.drug_id] = d; });
  // Hospital drug list: availability only, keyed by drug_id (an item may list several drugs).
  var formularyByDrug = {};
  readTable_('Formulary').forEach(function (f) {
    if (!visibility_(f, false, preview).visible) return;
    splitList_(f.drug_id).forEach(function (id) {
      (formularyByDrug[id] = formularyByDrug[id] || []).push({
        item_name: f.item_name, trade_name: f.trade_name, dosage_form: f.dosage_form,
        list_class: f.list_class, payment: f.payment, payment_group: f.payment_group || paymentGroupFor_(f.payment),
        hosxp_color: f.hosxp_color === 'none' ? '' : (f.hosxp_color || hosxpColorFor_(f.payment)),
        note: f.note, combo: splitList_(f.drug_id).length > 1
      });
    });
  });
  var drugs = [];
  links.sort(byOrder_).forEach(function (l) {
    var d = drugById[l.drug_id];
    if (!d) return;
    var vis = visibility_(d, true, preview);
    if (!vis.visible) return;
    useSource(d.source_id);
    drugs.push({
      drug_id: d.drug_id, generic_name: d.generic_name, brand_names_th: d.brand_names_th,
      drug_class: d.drug_class, starting_dose: d.starting_dose, usual_dose: d.usual_dose,
      maximum_dose: d.maximum_dose, titration: d.titration, renal_adjustment: d.renal_adjustment,
      hepatic_adjustment: d.hepatic_adjustment, contraindications: d.contraindications,
      adverse_effects: d.adverse_effects, monitoring: d.monitoring, interactions: d.interactions,
      special_precautions: d.special_precautions, aliases: d.aliases, source_id: d.source_id,
      source_location: d.source_location || '', source_check: d.source_check || 'needs_source_check',
      context_note: l.context_note, last_reviewed: d.last_reviewed || null, isDraft: vis.isDraft,
      formulary: formularyByDrug[d.drug_id] || []
    });
  });

  var algorithms = [];
  readTable_('Algorithms').forEach(function (a) {
    if (a.topic_id !== topicId) return;
    var vis = visibility_(a, true, preview);
    if (!vis.visible) return;
    useSource(a.source_id);
    algorithms.push({
      algorithm_id: a.algorithm_id, step_id: a.step_id, parent_step_id: a.parent_step_id,
      step_type: a.step_type, condition: a.condition, action: a.action,
      next_step_id: a.next_step_id, display_order: a.display_order || 0,
      source_id: a.source_id, source_location: a.source_location || '',
      source_check: a.source_check || 'needs_source_check', isDraft: vis.isDraft
    });
  });
  algorithms.sort(byOrder_);

  var references = readTable_('References')
    .filter(function (r) { return sourceIds[r.source_id] && r.status !== 'archived'; })
    .map(function (r) {
      return {
        source_id: r.source_id, organization: r.organization, region: r.region || '', guideline_title: r.guideline_title,
        publication_year: r.publication_year, edition_or_version: r.edition_or_version,
        url: /^https:\/\//i.test(r.url) ? r.url : '', document_section: r.document_section,
        evidence_grading_system: r.evidence_grading_system, grading_legend: r.grading_legend || '', last_verified: r.last_verified || null,
        isDraft: r.status !== 'published' || !r.last_verified
      };

/**
 * Browser-callable: the search index for the current content version.
 * @param {string=} clientVersion
 * @return {Object}
 */
function getSearchIndex(clientVersion) {
  return withErrorBoundary_('getSearchIndex', function () {
    if (!isDbConfigured_()) {
      return { ok: true, setupRequired: true, contentVersion: getContentVersion_(), entries: [], synonyms: DEFAULT_SYNONYM_GROUPS_ };
    }
    var payload = cached_('search', buildSearchIndex_);
    payload.contentVersion = getContentVersion_();
    payload.versionChanged = !!clientVersion && clientVersion !== payload.contentVersion;
    return payload;
  });
}

/** @return {Object} index payload (without contentVersion) */
function buildSearchIndex_() {
  var settings = readSettings_();
  var preview = settingBool_(settings, 'preview_drafts');
  var entries = [];

  var topics = {};
  readTable_('Topics').forEach(function (t) { if (visibility_(t, false, preview).visible) topics[t.topic_id] = true; });

  var sectionTypeById = {};
  readTable_('Sections').forEach(function (s) { sectionTypeById[s.section_id] = s.section_type; });

  readTable_('Recommendations').forEach(function (r) {
    if (!topics[r.topic_id]) return;
    var vis = visibility_(r, true, preview);
    if (!vis.visible) return;
    var plain = searchPlain_(r.recommendation_text);
    entries.push({
      k: 'rec', id: r.recommendation_id, t: r.topic_id, s: sectionTypeById[r.section_id] || 'custom',
      ti: searchTitle_(plain), su: [r.subsection, r.clinical_condition].filter(Boolean).join(' · '),
      tx: searchClip_(plain), st: r.display_style || 'standard', d: vis.isDraft ? 1 : 0
    });
  });

  var drugById = {};
  readTable_('Drugs').forEach(function (d) { drugById[d.drug_id] = d; });
  readTable_('TopicDrugs').forEach(function (l) {
    var d = drugById[l.drug_id];
    if (!d || !topics[l.topic_id]) return;
    var vis = visibility_(d, true, preview);
    if (!vis.visible) return;
    var fields = [
      ['start', d.starting_dose], ['usual', d.usual_dose], ['max', d.maximum_dose], ['titration', d.titration],
      ['renal / ไต', d.renal_adjustment], ['hepatic', d.hepatic_adjustment], ['contraindications', d.contraindications],
      ['adverse effects', d.adverse_effects], ['monitoring', d.monitoring], ['interactions', d.interactions],
      ['precautions', d.special_precautions], ['', l.context_note]
    ].filter(function (f) { return f[1]; }).map(function (f) { return (f[0] ? f[0] + ': ' : '') + searchPlain_(f[1]); });
    entries.push({
      k: 'drug', id: d.drug_id, t: l.topic_id, s: 'drugs', ti: d.generic_name, su: d.drug_class,
      al: splitList_(d.aliases).concat(splitList_(d.brand_names_th)), tx: searchClip_(fields.join(' · ')), d: vis.isDraft ? 1 : 0
    });
  });

  var algs = {}, algOrder = [];
  readTable_('Algorithms').forEach(function (a) {
    if (!topics[a.topic_id]) return;
    var vis = visibility_(a, true, preview);
    if (!vis.visible) return;
    var key = a.topic_id + '/' + a.algorithm_id;
    if (!algs[key]) { algs[key] = { id: a.algorithm_id, t: a.topic_id, start: '', parts: [], d: 0, order: [] }; algOrder.push(key); }
    var g = algs[key];
    if (a.step_type === 'start' && !g.start) g.start = searchTitle_(searchPlain_(a.action));
    g.order.push({ o: a.display_order || 0, txt: [a.condition, searchPlain_(a.action)].filter(Boolean).join(': ') });
    if (vis.isDraft) g.d = 1;
  });
  algOrder.forEach(function (key) {
    var g = algs[key];
    g.order.sort(function (a, b) { return a.o - b.o; });
    entries.push({
      k: 'alg', id: g.id, t: g.t, s: 'algorithm', ti: 'Flowchart: ' + (g.start || g.id), su: '',
      tx: searchClip_(g.order.map(function (x) { return x.txt; }).join(' → ')), d: g.d
    });
  });

  // Curated entries from the SearchIndex sheet (non-clinical: visible when published, or in preview).
  readTable_('SearchIndex').forEach(function (c) {
    if (!topics[c.topic_id] || !visibility_(c, false, preview).visible) return;
    entries.push({
      k: 'curated', id: c.search_id, t: c.topic_id, s: c.section_id ? (sectionTypeById[c.section_id] || 'custom') : '',
      tt: c.target_type || '', tid: c.target_id || '', ti: c.title, su: '',
      al: splitList_(c.keywords).concat(splitList_(c.aliases)), tx: searchClip_(searchPlain_(c.searchable_text)),
      d: c.status !== 'published' ? 1 : 0
    });
  });

  return { ok: true, previewDrafts: preview, entries: entries, synonyms: mergeSynonyms_(preview) };
}

/** Built-in groups + Synonyms sheet rows (published, or any non-archived row in preview). */
function mergeSynonyms_(preview) {
  var groups = DEFAULT_SYNONYM_GROUPS_.map(function (g) { return g.slice(); });
  readTable_('Synonyms').forEach(function (s) {
    if (!visibility_(s, false, preview).visible) return;
    var g = [String(s.term || '')].concat(splitList_(s.expands_to))
      .map(function (x) { return String(x).toLowerCase().trim(); }).filter(Boolean);
    if (g.length > 1) groups.push(g);
  });
  return groups;
}

/** Restricted-Markdown → plain text for matching and snippets. */
function searchPlain_(md) {
  return String(md || '')
    .replace(/\\([*_|\\#])/g, '$1')
    .replace(/^\s*\|?\s*-{2,}[\s|:-]*$/gm, ' ')   // table divider rows
    .replace(/\*\*|__|\*|`|^#+\s*/gm, '')
    .replace(/\|/g, ' · ')
    .replace(/^\s*[-•]\s+/gm, '')
    .replace(/[ \t]+/g, ' ')
    .replace(/(\s*·\s*){2,}/g, ' · ')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

/** First line, trimmed to a readable title. */
function searchTitle_(plain) {
  var line = String(plain || '').split('\n')[0].replace(/^[\s·]+|[\s·]+$/g, '');
  return line.length > 110 ? line.slice(0, 107).replace(/\s+\S*$/, '') + '…' : line;
}

function searchClip_(text) {
  text = String(text || '').replace(/\s*\n\s*/g, ' · ');
  return text.length > SEARCH_TEXT_LIMIT_ ? text.slice(0, SEARCH_TEXT_LIMIT_) : text;
}

/**
 * Editor self-check for Phase 5. Run from the Apps Script editor and read the log.
 * @return {string}
 */
function checkPhase5() {
  var lines = [];
  function check(label, okFlag, detail) { lines.push((okFlag ? 'PASS ' : 'FAIL ') + label + (detail ? ' — ' + detail : '')); }
  resetDataMemo_();
  var settings = readSettings_();
  var preview = settingBool_(settings, 'preview_drafts');
  var idx = buildSearchIndex_();
  var kinds = {};
  idx.entries.forEach(function (e) { kinds[e.k] = (kinds[e.k] || 0) + 1; });
  var json = JSON.stringify(idx);
  check('index builds', idx.ok === true, idx.entries.length + ' entries ' + JSON.stringify(kinds));
  check('index size under 500 KB', json.length < 500000, Math.round(json.length / 1024) + ' KB');
  check('synonym groups loaded', idx.synonyms.length >= DEFAULT_SYNONYM_GROUPS_.length, idx.synonyms.length + ' groups');
  check('no reviewer or audit data in the index', !/"reviewer"|"updated_by"/.test(json));
  if (!preview) check('no drafts in the index (preview_drafts is FALSE)', idx.entries.every(function (e) { return !e.d; }));
  else lines.push('NOTE preview_drafts is TRUE: drafts are included and flagged. Set it to FALSE before colleagues use the app.');
  var text = 'CPG Pocket — Phase 5 self-check\n' + lines.join('\n');
  console.log(text);
  return text;
}

/**
 * Evaluates CalcCore.html (the browser file) and returns CPGCalcCore.
 * @param {string=} source optional file content (tests)
 */
function loadCalcCore_(source) {
  var html = source || HtmlService.createHtmlOutputFromFile('CalcCore').getContent();
  var js = String(html).replace(/^[\s\S]*?<script>/, '').replace(/<\/script>[\s\S]*$/, '');
  /* eslint-disable no-new-func */
  return new Function(js + '\nreturn CPGCalcCore;')();
}

/**
 * Runs every test vector against a CalcCore object.
 * @return {{passed:number, failed:string[]}}
 */
function runCalcVectors_(core) {
  var failed = [], passed = 0;
  function get(o, path) { return path.split('.').reduce(function (a, k) { return a === undefined || a === null ? undefined : a[k]; }, o); }
  CALC_TEST_VECTORS_.forEach(function (v, i) {
    var label = '#' + i + ' ' + v.fn + ' ' + JSON.stringify(v.input || v.args);
    try {
      var res = v.args ? core[v.fn].apply(null, v.args) : core[v.fn](v.input);
      if ('value' in v) {
        if (res !== v.value) throw new Error('expected ' + v.value + ' got ' + res);
      } else if (v.errors) {
        if (res.ok !== false) throw new Error('expected an input error');
        v.errors.forEach(function (k) { if (!res.errors[k]) throw new Error('expected error on ' + k + ', got ' + JSON.stringify(res.errors)); });
      } else {
        if (!res.ok) throw new Error('unexpected errors ' + JSON.stringify(res.errors));
        Object.keys(v.expect).forEach(function (k) {
          var want = v.expect[k], got = get(res, k);
          var good = typeof want === 'number' ? Math.abs(got - want) <= (v.tol || 1e-9) : got === want;
          if (!good) throw new Error(k + ' expected ' + want + ' got ' + got);
        });
      }
      passed++;
    } catch (e) {
      failed.push(label + ': ' + e.message);
    }
  });
  return { passed: passed, failed: failed };
}

/** Editor self-check: runs all calculator test vectors on the server. */
function checkPhase6() {
  var lines = [];
  function line(okFlag, text) { lines.push((okFlag ? 'PASS ' : 'FAIL ') + text); }
  var core = null;
  try { core = loadCalcCore_(); line(true, 'CalcCore loads — version ' + core.VERSION); }
  catch (e) { line(false, 'CalcCore loads — ' + e.message); }
  if (core) {
    var r = runCalcVectors_(core);
    line(!r.failed.length, 'calculator test vectors — ' + r.passed + ' passed, ' + r.failed.length + ' failed');
    r.failed.forEach(function (f) { lines.push('     ' + f); });
  }
  var ids = CALCULATOR_REGISTRY.map(function (c) { return c.calc_id; });
  var bad = CALCULATOR_REGISTRY.filter(function (c) { return c.status !== 'verified' && c.status !== 'reconstructed' && c.status !== 'unavailable'; });
  line(!bad.length, 'registry statuses valid — ' + ids.length + ' calculators');
  var text = lines.join('\n');
  console.log(text);
  return text;
}

/**
 * Creates or repairs the whole database. Safe to run any number of times:
 * it adds missing sheets, columns, dropdowns and seed rows; it never deletes.
 * @return {string} report
 */
function setupDatabase() {
  requireEditorContext_();
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  var report = [];
  try {
    var ss = resolveSetupSpreadsheet_();
    PropertiesService.getScriptProperties().setProperty(PROP_SPREADSHEET_ID_, ss.getId());
    resetDataMemo_();
    DS_MEMO_.db = ss;
    report.push('Database: ' + ss.getName() + ' (' + ss.getUrl() + ')');

    DB_SCHEMA.forEach(function (def) { report.push(ensureSheet_(ss, def)); });

    report.push(seedSettings_(ss));
    report.push(seedTopics_(ss));
    report.push(seedSections_(ss));
    report.push(seedCalculators_(ss));
    removeDefaultSheet_(ss);

    report.push(runMigrations_(ss));

    if (!PropertiesService.getScriptProperties().getProperty(PROP_CONTENT_VERSION_)) {
      setContentVersion_(ss, newContentVersion_());
    } else {
      // Mirror the authoritative version into AppSettings for humans.
      setSetting_(ss, 'content_version', getContentVersion_());
    }
    report.push('Content version: ' + getContentVersion_());
    logChange_(ss, 'setup', 'Database', ss.getId(), 'setupDatabase() completed', '', getContentVersion_());
    SpreadsheetApp.flush();
  } finally {
    lock.releaseLock();
  }
  var text = report.join('\n');
  console.log(text);
  uiAlert_('CPG Pocket — setup complete', text + '\n\nNext: CPG Pocket ▸ Validate database.');
  return text;
}

/**
 * Bound project → its own Sheet. Standalone project → stored ID, or a new Sheet.
 * @return {GoogleAppsScript.Spreadsheet.Spreadsheet}
 */
function resolveSetupSpreadsheet_() {
  var id = PropertiesService.getScriptProperties().getProperty(PROP_SPREADSHEET_ID_);
  if (id) {
    try { return SpreadsheetApp.openById(id); } catch (e) { console.warn('Stored spreadsheet not reachable, re-resolving: ' + e); }
  }
  var active = null;
  try { active = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { active = null; }
  if (active) return active;
  return SpreadsheetApp.create('CPG Pocket DB');
}

/**
 * Creates a sheet if missing, appends missing header columns, and (re)applies
 * formatting, dropdowns, checkboxes and duplicate-ID highlighting.
 * @return {string} one-line report
 */
function ensureSheet_(ss, def) {
  var sh = ss.getSheetByName(def.sheet);
  var created = false;
  if (!sh) { sh = ss.insertSheet(def.sheet); created = true; }

  var wanted = def.columns.map(function (c) { return c.name; });
  var lastCol = sh.getLastColumn();
  var existing = lastCol > 0 ? sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function (h) { return String(h).trim(); }) : [];
  var missing = wanted.filter(function (w) { return existing.indexOf(w) === -1; });
  if (existing.filter(String).length === 0) {
    sh.getRange(1, 1, 1, wanted.length).setValues([wanted]);
    existing = wanted.slice();
    missing = [];
  } else if (missing.length) {
    var start = existing.length + 1;
    if (sh.getMaxColumns() < start + missing.length - 1) sh.insertColumnsAfter(sh.getMaxColumns(), start + missing.length - 1 - sh.getMaxColumns());
    sh.getRange(1, start, 1, missing.length).setValues([missing]);
    existing = existing.concat(missing);
  }

  if (sh.getMaxRows() < SETUP_MIN_ROWS_) sh.insertRowsAfter(sh.getMaxRows(), SETUP_MIN_ROWS_ - sh.getMaxRows());
  var bodyRows = sh.getMaxRows() - 1;

  // Header formatting
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, existing.length)
    .setFontWeight('bold').setBackground('#e2f3f3').setFontColor('#0a4f50').setWrap(false);

  var rules = [];
  def.columns.forEach(function (col) {
    var c = existing.indexOf(col.name) + 1;
    var body = sh.getRange(2, c, bodyRows, 1);
    var headerCell = sh.getRange(1, c);
    headerCell.setNote(columnNote_(def, col));

    var dv = null;
    if (col.kind === 'enum') dv = SpreadsheetApp.newDataValidation().requireValueInList(col.values, true).setAllowInvalid(false).build();
    else if (col.kind === 'bool') dv = SpreadsheetApp.newDataValidation().requireCheckbox().build();
    else if (col.kind === 'int') dv = SpreadsheetApp.newDataValidation().requireNumberBetween(-1000000, 100000000).setAllowInvalid(false).build();
    else if (col.kind === 'date') dv = SpreadsheetApp.newDataValidation().requireDate().setAllowInvalid(false).build();
    if (dv) body.setDataValidation(dv);
    if (col.kind === 'date') body.setNumberFormat('yyyy-mm-dd');
    if (col.kind === 'datetime') body.setNumberFormat('yyyy-mm-dd hh:mm:ss');
    if (col.kind === 'md') { sh.setColumnWidth(c, MD_COLUMN_WIDTH_); body.setWrap(true); }
    if (col.required) headerCell.setFontColor('#0a4f50').setFontWeight('bold');
  });

  // Duplicate-key highlighting (red) — single or composite keys.
  var keyCols = def.id ? [def.id]
    : def.sheet === 'Algorithms' ? ['algorithm_id', 'step_id']
    : def.sheet === 'TopicDrugs' ? ['topic_id', 'drug_id'] : [];
  if (keyCols.length) {
    var letters = keyCols.map(function (k) { return columnLetter_(existing.indexOf(k) + 1); });
    var formula = keyCols.length === 1
      ? '=AND($' + letters[0] + '2<>"",COUNTIF($' + letters[0] + ':$' + letters[0] + ',$' + letters[0] + '2)>1)'
      : '=AND($' + letters[0] + '2<>"",COUNTIFS($' + letters[0] + ':$' + letters[0] + ',$' + letters[0] + '2,$' + letters[1] + ':$' + letters[1] + ',$' + letters[1] + '2)>1)';
    rules.push(SpreadsheetApp.newConditionalFormatRule()
      .whenFormulaSatisfied(formula).setBackground('#f8d7da').setFontColor('#842029')
      .setRanges([sh.getRange(2, 1, bodyRows, existing.length)]).build());
  }
  // Grey out archived rows.
  var statusIdx = existing.indexOf('status');
  if (statusIdx >= 0) {
    var sl = columnLetter_(statusIdx + 1);
    rules.push(SpreadsheetApp.newConditionalFormatRule()
      .whenFormulaSatisfied('=$' + sl + '2="archived"').setFontColor('#9aa5ab')
      .setRanges([sh.getRange(2, 1, bodyRows, existing.length)]).build());
  }
  sh.setConditionalFormatRules(rules);

  return (created ? 'Created ' : 'Checked ') + def.sheet + (missing.length ? ' (+ columns: ' + missing.join(', ') + ')' : '');
}

function columnNote_(def, col) {
  var lines = [col.name + ' — ' + col.kind + (col.required ? ' (required)' : '')];
  if (col.values) lines.push('Allowed: ' + col.values.join(', '));
  if (col.ref) lines.push('Must match an ID in ' + col.ref);
  if (col.kind === 'list') lines.push('Separate several values with |');
  if (col.kind === 'md') lines.push('Text with **bold**, *italic*, - bullets, 1. numbered, | tables |. No HTML.');
  if (col.name === 'status' && def.clinical) lines.push('Shown to users only when published AND last_reviewed AND reviewer are filled.');
  return lines.join('\n');
}

function columnLetter_(n) {
  var s = '';
  while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/* ==========================================================================
 * Seed data (non-clinical only)
 * ======================================================================== */

function seedSettings_(ss) {
  var sh = ss.getSheetByName('AppSettings');
  var have = {};
  readSheetObjects_(sh).forEach(function (r) { have[r.setting_key] = true; });
  var add = DEFAULT_SETTINGS.filter(function (d) { return !have[d[0]]; })
    .map(function (d) { return { setting_key: d[0], setting_value: d[1], description: d[2] }; });
  appendObjects_(sh, add);
  return 'AppSettings: ' + add.length + ' default setting(s) added';
}

function seedTopics_(ss) {
  var sh = ss.getSheetByName('Topics');
  var have = {};
  readSheetObjects_(sh).forEach(function (r) { have[r.topic_id] = true; });
  var now = nowStamp_(), who = currentEditor_();
  // Existing rows are never changed; a topic added in a later version is appended with its own status.
  var rows = DEFAULT_TOPICS.filter(function (t) { return !have[t.topic_id]; }).map(function (t) {
    return {
      topic_id: t.topic_id, title: t.title, title_th: t.title_th, abbreviation: t.abbreviation,
      description: t.description, icon: t.icon, accent: t.accent, aliases: (t.aliases || []).join('|'),
      display_order: t.display_order, status: t.status || 'published', last_reviewed: '', version: 1, updated_at: now, updated_by: who
    };
  });
  appendObjects_(sh, rows);
  var kept = Object.keys(have).length;
  return 'Topics: ' + rows.length + ' module(s) added' + (kept ? ', ' + kept + ' existing kept' : '') + ' (card names and search aliases only)';
}

function seedSections_(ss) {
  var topics = readSheetObjects_(ss.getSheetByName('Topics'));
  var sh = ss.getSheetByName('Sections');
  var have = {};
  readSheetObjects_(sh).forEach(function (r) { have[r.topic_id + '|' + r.section_type] = true; });
  var now = nowStamp_(), who = currentEditor_();
  var rows = [];
  topics.forEach(function (t) {
    if (!t.topic_id) return;
    SECTION_TYPES.forEach(function (s, i) {
      if (have[t.topic_id + '|' + s.type]) return;
      rows.push({
        section_id: 'SEC-' + t.topic_id + '-' + s.type.toUpperCase(), topic_id: t.topic_id,
        section_type: s.type, title: s.title, summary: '', content: '', display_order: i + 1,
        status: 'draft', last_reviewed: '', reviewer: '', version: 1, updated_at: now, updated_by: who
      });
    });
  });
  appendObjects_(sh, rows);
  return 'Sections: ' + rows.length + ' empty draft section(s) added';
}

function seedCalculators_(ss) {
  var sh = ss.getSheetByName('Calculators');
  var have = {};
  readSheetObjects_(sh).forEach(function (r) { have[r.calc_id] = true; });
  var rows = CALCULATOR_REGISTRY.filter(function (c) { return !have[c.calc_id]; }).map(function (c) {
    return { calc_id: c.calc_id, title: c.title, topic_ids: c.topic_ids.join('|'), source_id: '', status: 'unavailable',
             verified_by: '', verified_at: '', limitations: '' };
  });
  appendObjects_(sh, rows);
  return 'Calculators: ' + rows.length + ' registry row(s) added (all unavailable)';
}

/** Deletes the blank default "Sheet1"/"แผ่น1" if it is empty. */
function removeDefaultSheet_(ss) {
  ['Sheet1', 'แผ่น1', 'Hoja 1', 'Feuille 1'].forEach(function (name) {
    var sh = ss.getSheetByName(name);
    if (sh && sh.getLastRow() === 0 && sh.getLastColumn() === 0 && ss.getSheets().length > 1) ss.deleteSheet(sh);
  });
}

/* ==========================================================================
 * Migrations
 * ======================================================================== */

function runMigrations_(ss) {
  var current = Number(readSheetSetting_(ss, 'schema_version')) || 0;
  if (current > APP_CONFIG.SCHEMA_VERSION) {
    throw new Error('Database schema v' + current + ' is newer than this code (v' + APP_CONFIG.SCHEMA_VERSION + '). Deploy the newer code.');
  }
  var applied = [];
  MIGRATIONS_.forEach(function (m) {
    if (m.to <= current || m.to > APP_CONFIG.SCHEMA_VERSION) return;
    m.run(ss);
    setSetting_(ss, 'schema_version', String(m.to));
    logChange_(ss, 'migrate', 'Schema', 'v' + m.to, m.description, String(m.to), getContentVersion_());
    applied.push('v' + m.to);
    current = m.to;
  });
  return 'Schema: v' + current + (applied.length ? ' (applied ' + applied.join(', ') + ')' : ' (up to date)');
}

/* ==========================================================================
 * Publish (content version bump → caches refresh)
 * ======================================================================== */

/**
 * Validates, then bumps content_version so the app and caches load the new
 * content. It does not change any row's status; set status/reviewer/last_reviewed
 * on the rows first (Phase 7 adds a guided review workflow).
 */
function publishChanges() {
  requireEditorContext_();
  var ss = getDb_();
  var result = validateDatabase_(ss);
  if (result.errors.length) {
    uiAlert_('Publish blocked', result.errors.length + ' error(s) must be fixed first.\n\n' +
      result.errors.slice(0, 15).join('\n') + (result.errors.length > 15 ? '\n…' : '') +
      '\n\nRun CPG Pocket ▸ Validate database for the full list.');
    return { ok: false, errors: result.errors };
  }
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var v = newContentVersion_();
    setContentVersion_(ss, v);
    logChange_(ss, 'publish', 'Content', v, 'Published content version ' + v + ' (' + result.warnings.length + ' warning(s))', '', v);
  } finally { lock.releaseLock(); }
  uiAlert_('Published', 'Content version ' + getContentVersion_() + ' is live.\nUsers get it the next time they open or refresh the app.' +
    (result.warnings.length ? '\n\nWarnings (' + result.warnings.length + '):\n' + result.warnings.slice(0, 10).join('\n') : ''));
  return { ok: true, contentVersion: getContentVersion_(), warnings: result.warnings };
}

function newContentVersion_() {
  var v = formatDate_(new Date(), 'yyyy.MM.dd-HHmmss');
  // Two publishes in the same second must still give different versions (cache keys).
  if (v === getContentVersion_() || getContentVersion_().indexOf(v + '-') === 0) v += '-' + Math.floor(Math.random() * 1296 + 1296).toString(36);
  return v;
}

function setContentVersion_(ss, v) {
  PropertiesService.getScriptProperties().setProperty(PROP_CONTENT_VERSION_, v);
  setSetting_(ss, 'content_version', v);
}

/* ==========================================================================
 * Validation
 * ======================================================================== */

/** Menu/editor entry: validates and shows the report. */
function validateDatabase() {
  requireEditorContext_();
  var result = validateDatabase_(getDb_());
  var text = 'Errors: ' + result.errors.length + '   Warnings: ' + result.warnings.length + '\n\n' +
    (result.errors.length ? 'ERRORS\n' + result.errors.join('\n') + '\n\n' : '') +
    (result.warnings.length ? 'WARNINGS\n' + result.warnings.join('\n') : '') +
    (!result.errors.length && !result.warnings.length ? 'No problems found.' : '');
  console.log(text);
  uiReport_('CPG Pocket — validation', result);
  return result;
}

/**
 * @param {GoogleAppsScript.Spreadsheet.Spreadsheet} ss
 * @return {{errors: string[], warnings: string[]}}
 */
function validateDatabase_(ss) {
  var input = readValidationInput_(ss);
  return validateTables_(input.tables, input.errors);
}

/** Reads every schema sheet (typed rows) and reports missing sheets/columns. */
function readValidationInput_(ss) {
  resetDataMemo_();
  DS_MEMO_.db = ss;
  var errors = [], tables = {};
  DB_SCHEMA.forEach(function (def) {
    var sh = ss.getSheetByName(def.sheet);
    if (!sh) { errors.push(def.sheet + ': sheet is missing (run Set up / repair database)'); tables[def.sheet] = []; return; }
    var lastCol = sh.getLastColumn();
    var headers = lastCol ? sh.getRange(1, 1, 1, lastCol).getValues()[0].map(String) : [];
    def.columns.forEach(function (c) {
      if (headers.indexOf(c.name) === -1) errors.push(def.sheet + ': column "' + c.name + '" is missing');
    });
    tables[def.sheet] = readTable_(def.sheet);
  });
  return { tables: tables, errors: errors };
}

/**
 * Integrity rules over typed rows. Pure: the admin publish step runs it on the
 * tables with the approved changes applied in memory, before anything is written.
 * @param {Object<string,Object[]>} tables
 * @param {string[]=} startErrors
 * @return {{errors: string[], warnings: string[]}}
 */
function validateTables_(tables, startErrors) {
  var errors = (startErrors || []).slice(), warnings = [];
  DB_SCHEMA.forEach(function (def) { if (!tables[def.sheet]) tables[def.sheet] = []; });

  var ids = {};
  DB_SCHEMA.forEach(function (def) {
    var rows = tables[def.sheet];
    var seen = {};
    ids[def.sheet] = {};
    rows.forEach(function (r) {
      var where = def.sheet + ' row ' + r._row;
      if (r.status === 'archived') return;
      def.columns.forEach(function (c) {
        var v = r[c.name];
        var empty = v === '' || v === null || (Array.isArray(v) && !v.length);
        if (c.required && empty) errors.push(where + ': "' + c.name + '" is required');
        if (c.kind === 'enum' && !empty && c.values.indexOf(v) === -1) errors.push(where + ': "' + c.name + '" has invalid value "' + v + '"');
        if (c.pattern && !empty && !new RegExp(c.pattern).test(v)) errors.push(where + ': "' + c.name + '" must match ' + c.pattern);
        if (c.kind === 'url' && !empty && !/^https:\/\//i.test(v)) warnings.push(where + ': url should start with https:// (it will not be linked)');
      });
      var key = def.id ? r[def.id]
        : def.sheet === 'Algorithms' ? r.algorithm_id + ' / ' + r.step_id
        : def.sheet === 'TopicDrugs' ? r.topic_id + ' / ' + r.drug_id : null;
      if (key !== null) {
        if (seen[key]) errors.push(where + ': duplicate key "' + key + '" (also row ' + seen[key] + ')');
        else seen[key] = r._row;
      }
      if (def.id) ids[def.sheet][r[def.id]] = r;

      if (def.clinical && r.status === 'published' && (!r.last_reviewed || !r.reviewer)) {
        errors.push(where + ': published clinical content needs last_reviewed and reviewer (it stays hidden until filled)');
      }
    });
  });

  // Foreign keys
  var sectionById = ids.Sections;
  DB_SCHEMA.forEach(function (def) {
    def.columns.forEach(function (c) {
      if (!c.ref) return;
      tables[def.sheet].forEach(function (r) {
        if (r.status === 'archived') return;
        var vals = Array.isArray(r[c.name]) ? r[c.name] : (r[c.name] ? [r[c.name]] : []);
        vals.forEach(function (v) {
          if (!ids[c.ref] || !ids[c.ref][v]) errors.push(def.sheet + ' row ' + r._row + ': "' + c.name + '" = "' + v + '" not found in ' + c.ref);
        });
      });
    });
  });
  tables.Recommendations.forEach(function (r) {
    var s = sectionById[r.section_id];
    if (s && s.topic_id !== r.topic_id) errors.push('Recommendations row ' + r._row + ': section ' + r.section_id + ' belongs to ' + s.topic_id + ', not ' + r.topic_id);
    if (r.status === 'published') {
      var ref = ids.References[r.source_id];
      if (ref && (ref.status !== 'published' || !ref.last_verified)) warnings.push('Recommendations row ' + r._row + ': source ' + r.source_id + ' is not yet verified/published');
    }
  });

  ['Recommendations', 'Drugs', 'Algorithms'].forEach(function (n) {
    tables[n].forEach(function (r) {
      if (r.status === 'published' && r.source_check !== 'checked_against_source') {
        errors.push(n + ' row ' + r._row + ': published content must have source_check = checked_against_source');
      }
    });
  });

  // One standard section of each type per topic
  var secSeen = {};
  tables.Sections.forEach(function (s) {
    if (s.section_type === 'custom' || s.status === 'archived') return;
    var k = s.topic_id + '|' + s.section_type;
    if (secSeen[k]) errors.push('Sections row ' + s._row + ': topic ' + s.topic_id + ' already has a "' + s.section_type + '" section (row ' + secSeen[k] + ')');
    else secSeen[k] = s._row;
  });

  // Algorithms: links resolve, one start, no cycles
  var algs = {};
  tables.Algorithms.forEach(function (a) {
    if (a.status === 'archived') return;
    (algs[a.algorithm_id] = algs[a.algorithm_id] || []).push(a);
  });
  Object.keys(algs).forEach(function (id) {
    var steps = algs[id], byStep = {};
    steps.forEach(function (s) { byStep[s.step_id] = s; });
    var starts = steps.filter(function (s) { return s.step_type === 'start'; }).length;
    if (starts !== 1) errors.push('Algorithm ' + id + ': needs exactly one "start" step (found ' + starts + ')');
    steps.forEach(function (s) {
      if (s.parent_step_id && !byStep[s.parent_step_id]) errors.push('Algorithm ' + id + ' step ' + s.step_id + ': parent "' + s.parent_step_id + '" not found');
      s.next_step_id.forEach(function (n) { if (!byStep[n]) errors.push('Algorithm ' + id + ' step ' + s.step_id + ': next "' + n + '" not found'); });
    });
    // cycle check over parent links
    steps.forEach(function (s) {
      var seenSteps = {}, cur = s, hops = 0;
      while (cur && cur.parent_step_id && hops < 500) {
        if (seenSteps[cur.step_id]) { errors.push('Algorithm ' + id + ': cycle through step ' + s.step_id); break; }
        seenSteps[cur.step_id] = true; cur = byStep[cur.parent_step_id]; hops++;
      }
    });
  });

  // References sanity (1950 floor: older dosing equations such as Devine 1974 are cited)
  var thisYear = new Date().getFullYear();
  tables.References.forEach(function (r) {
    if (r.publication_year !== null && (r.publication_year < 1950 || r.publication_year > thisYear + 1)) {
      errors.push('References row ' + r._row + ': publication_year ' + r.publication_year + ' looks wrong');
    }
    if (r.status === 'published' && !r.last_verified) errors.push('References row ' + r._row + ': published source needs last_verified');
  });

  // Settings
  var settings = {};
  tables.AppSettings.forEach(function (s) { settings[s.setting_key] = s.setting_value; });
  if (String(settings.preview_drafts).toUpperCase() === 'TRUE') warnings.push('AppSettings: preview_drafts is TRUE — unreviewed content is visible to everyone (with DRAFT banners)');

  // de-duplicate FK messages from cycle detection
  errors = errors.filter(function (e, i) { return errors.indexOf(e) === i; });
  return { errors: errors, warnings: warnings };
}

function showStatus() {
  requireEditorContext_();
  var ss = getDb_();
  resetDataMemo_(); DS_MEMO_.db = ss;
  var settings = readSettings_();
  var preview = settingBool_(settings, 'preview_drafts');
  var lines = [
    'Database: ' + ss.getName(),
    'Schema version: ' + (settings.schema_version || '?') + ' (code expects ' + APP_CONFIG.SCHEMA_VERSION + ')',
    'Content version: ' + getContentVersion_(),
    'Code version: ' + APP_CONFIG.CODE_VERSION,
    'Preview drafts: ' + (preview ? 'ON' : 'off'),
    ''
  ];
  DB_SCHEMA.forEach(function (def) {
    var rows = readTable_(def.sheet);
    if (!def.clinical) { lines.push(def.sheet + ': ' + rows.length + ' rows'); return; }
    var visible = rows.filter(function (r) { return visibility_(r, true, false).visible; }).length;
    lines.push(def.sheet + ': ' + rows.length + ' rows, ' + visible + ' visible to users');
  });
  var url = '';
  try { url = ScriptApp.getService().getUrl() || ''; } catch (e) { url = ''; }
  if (url) lines.push('', 'Web app: ' + url);
  var text = lines.join('\n');
  console.log(text);
  uiAlert_('CPG Pocket — status', text);
  return text;
}

/** Editor self-check for Phase 3. */
function checkPhase3() {
  requireEditorContext_();
  var out = [];
  out.push(isDbConfigured_() ? 'OK   database connected' : 'FAIL database not connected → run setupDatabase');
  if (isDbConfigured_()) {
    var v = validateDatabase_(getDb_());
    out.push((v.errors.length ? 'FAIL ' : 'OK   ') + 'validation: ' + v.errors.length + ' errors, ' + v.warnings.length + ' warnings');
    resetDataMemo_();
    var boot = buildBootstrap_();
    out.push('OK   bootstrap from ' + boot.dataSource + ': ' + boot.topics.length + ' topics, content ' + boot.contentVersion);
    var t = getTopic('HT');
    out.push((t.ok ? 'OK   ' : 'FAIL ') + 'getTopic(HT): ' + (t.ok ? t.sections.length + ' visible sections, ' + t.recommendations.length + ' visible recommendations' : t.error));
    var bad = getTopic('<script>');
    out.push((bad.ok === false ? 'OK   ' : 'FAIL ') + 'invalid topic id rejected');
    cachePut_('selftest', { big: new Array(30000).join('x') + new Array(30000).join('y') + new Array(60000).join('z') });
    var back = cacheGet_('selftest');
    out.push((back && back.big.length === 119997 ? 'OK   ' : 'FAIL ') + 'chunked cache round trip');
  }
  var text = out.join('\n');
  console.log(text);
  return text;
}

/* ==========================================================================
 * Helpers
 * ======================================================================== */

/**
 * Allows only editor/menu/owner context. In the web app (Execute as: Me) an
 * anonymous visitor has no active-user email, so they are refused.
 */
function requireEditorContext_() {
  var active = '', effective = '';
  try { active = Session.getActiveUser().getEmail(); } catch (e) { active = ''; }
  try { effective = Session.getEffectiveUser().getEmail(); } catch (e) { effective = ''; }
  if (!active || !effective || active !== effective) {
    throw new Error('Not authorized. Run this from the Apps Script editor or the CPG Pocket menu in the Sheet.');
  }
}

function currentEditor_() {
  try { return Session.getActiveUser().getEmail() || 'unknown'; } catch (e) { return 'unknown'; }
}

function nowStamp_() { return formatDate_(new Date(), 'yyyy-MM-dd HH:mm:ss'); }

/** Reads a sheet into objects keyed by its own header row (no schema typing). */
function readSheetObjects_(sh) {
  if (!sh || sh.getLastRow() < 2) return [];
  var values = sh.getRange(1, 1, sh.getLastRow(), sh.getLastColumn()).getValues();
  var headers = values[0].map(String);
  return values.slice(1).map(function (row) {
    var o = {};
    headers.forEach(function (h, i) { if (h) o[h] = row[i]; });
    return o;
  }).filter(function (o) { return o[headers[0]] !== '' && o[headers[0]] !== null; });
}

/** Appends objects in one batch, mapping keys to the sheet's header order. */
function appendObjects_(sh, objects) {
  if (!objects.length) return;
  var headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String);
  var rows = objects.map(function (o) {
    return headers.map(function (h) { return o[h] === undefined || o[h] === null ? '' : o[h]; });
  });
  var start = lastDataRow_(sh) + 1;
  sh.getRange(start, 1, rows.length, headers.length).setValues(rows);
  invalidateTables_();
}

/** Last row with a value in column A (ignores pre-formatted empty rows). */
function lastDataRow_(sh) {
  var last = sh.getLastRow();
  if (last < 2) return Math.max(last, 1);
  var colA = sh.getRange(1, 1, last, 1).getValues();
  for (var i = colA.length - 1; i >= 0; i--) if (colA[i][0] !== '' && colA[i][0] !== null) return i + 1;
  return 1;
}

function readSheetSetting_(ss, key) {
  var rows = readSheetObjects_(ss.getSheetByName('AppSettings'));
  for (var i = 0; i < rows.length; i++) if (rows[i].setting_key === key) return rows[i].setting_value;
  return null;
}

function setSetting_(ss, key, value) {
  var sh = ss.getSheetByName('AppSettings');
  var headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String);
  var kCol = headers.indexOf('setting_key') + 1, vCol = headers.indexOf('setting_value') + 1;
  var last = sh.getLastRow();
  if (last >= 2 && kCol > 0 && vCol > 0) {
    var keys = sh.getRange(2, kCol, last - 1, 1).getValues();
    for (var i = 0; i < keys.length; i++) {
      if (String(keys[i][0]) === key) { sh.getRange(i + 2, vCol).setValue(value); invalidateTables_(); return; }
    }
  }
  appendObjects_(sh, [{ setting_key: key, setting_value: value, description: '' }]);
}

function logChange_(ss, action, recordType, recordId, description, version, contentVersion) {
  var sh = ss.getSheetByName('ChangeLog');
  if (!sh) return;
  var id = 'CHG-' + formatDate_(new Date(), 'yyyyMMdd-HHmmss') + '-' + ('00000' + Math.floor(Math.random() * 0x1000000).toString(16)).slice(-6);
  appendObjects_(sh, [{
    change_id: id, timestamp: nowStamp_(), editor: currentEditor_(), record_type: recordType, record_id: recordId,
    action: action, change_description: description, version: version || '', content_version: contentVersion || ''
  }]);
}

function uiAlert_(title, text) {
  try { SpreadsheetApp.getUi().alert(title, text, SpreadsheetApp.getUi().ButtonSet.OK); }
  catch (e) { console.log(title + '\n' + text); }
}

/** Shows a scrollable validation report dialog in the Sheet (escaped text). */
function uiReport_(title, result) {
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var html = '<div style="font:14px/1.5 -apple-system,Segoe UI,sans-serif;padding:4px 8px">' +
    '<p><b>' + result.errors.length + '</b> error(s), <b>' + result.warnings.length + '</b> warning(s)</p>' +
    (result.errors.length ? '<h3 style="color:#b42318">Errors (must fix before publishing)</h3><ul>' + result.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') +
    (result.warnings.length ? '<h3 style="color:#a2560a">Warnings</h3><ul>' + result.warnings.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '') +

    SpreadsheetApp.getUi().showModalDialog(HtmlService.createHtmlOutput(html).setWidth(640).setHeight(480), title);

/**
 * Loads the starter content (all draft).
 *  - adds rows whose key is missing
 *  - refreshes rows that are still draft with no reviewer, only when content changed
 *  - leaves every reviewed or published row exactly as it is
 *  - archives retired starter rows that are still untouched drafts
 * @return {string} report
 */
function seedStarterContent() {
  requireEditorContext_();
  var ss = getDb_();
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  var report = [];
  try {
    var now = nowStamp_(), who = currentEditor_();
    var AUDIT = { updated_at: 1, updated_by: 1, last_reviewed: 1, reviewer: 1, version: 1, status: 1, last_verified: 1, verified_by: 1 };

    function untouched(o, clinical) {
      if (o.status === undefined) return true;           // e.g. TopicDrugs
      var st = String(o.status);
      if (st !== 'draft' && !(st === 'unavailable' && !clinical)) return false;   // Calculators start as 'unavailable'
      return clinical ? !o.reviewer : !o.verified_by;
    }
    function same(a, b) {
      if (a === null || a === undefined) a = '';
      if (b === null || b === undefined) b = '';
      if (typeof b === 'boolean' || typeof a === 'boolean') return String(a).toUpperCase() === String(b).toUpperCase();
      return String(a) === String(b);
    }

    function upsert(sheetName, keyFn, rows, clinical, retired) {
      var sh = ss.getSheetByName(sheetName);
      var last = lastDataRow_(sh), width = sh.getLastColumn();
      var values = sh.getRange(1, 1, last, width).getValues();
      var headers = values[0].map(String);
      var index = {};
      for (var r = 1; r < values.length; r++) {
        var o = {};
        headers.forEach(function (h, c) { if (h) o[h] = values[r][c]; });
        index[keyFn(o)] = { row: r, obj: o };
      }
      var add = [], updated = 0, unchanged = 0, kept = 0, archived = 0, dirty = false;
      function setCell(r, name, val) { var c = headers.indexOf(name); if (c >= 0) values[r][c] = val; }
      rows.forEach(function (row) {
        var hit = index[keyFn(row)];
        if (!hit) {
          if (clinical) { row.updated_at = now; row.updated_by = who; }
          add.push(row); return;
        }
        if (!untouched(hit.obj, clinical)) { kept++; return; }
        var promote = !clinical && String(hit.obj.status) === 'unavailable' && row.status === 'draft';
        var changed = promote || headers.some(function (h) { return h && !AUDIT[h] && (h in row) && !same(hit.obj[h], row[h]); });
        if (!changed) { unchanged++; return; }
        headers.forEach(function (h, c) { if (h && !AUDIT[h] && (h in row)) values[hit.row][c] = row[h]; });
        if (promote) setCell(hit.row, 'status', 'draft');
        if (clinical) {
          setCell(hit.row, 'version', (Number(hit.obj.version) || 1) + 1);
          setCell(hit.row, 'updated_at', now);
          setCell(hit.row, 'updated_by', who);
        }
        updated++; dirty = true;
      });
      (retired || []).forEach(function (key) {
        var hit = index[key];
        if (!hit || !untouched(hit.obj, clinical)) return;
        setCell(hit.row, 'status', 'archived');
        if (clinical) { setCell(hit.row, 'updated_at', now); setCell(hit.row, 'updated_by', who); }
        archived++; dirty = true;
      });
      if (dirty) sh.getRange(1, 1, values.length, width).setValues(values);
      appendObjects_(sh, add);
      report.push(sheetName + ': ' + add.length + ' added, ' + updated + ' updated, ' + unchanged + ' unchanged' +
        (kept ? ', ' + kept + ' kept (already reviewed)' : '') + (archived ? ', ' + archived + ' retired → archived' : ''));
    }

    upsert('References', function (r) { return r.source_id; }, SEED_REFERENCES_.map(function (r) {
      var o = {}; Object.keys(r).forEach(function (k) { o[k] = r[k]; });
      o.grading_legend = SEED_GRADING_LEGENDS_[r.source_id] || ''; return o;
    }), false);
    upsert('Recommendations', function (r) { return r.recommendation_id; }, seedRecommendations_(), true, SEED_RETIRED_.Recommendations);
    upsert('Algorithms', function (r) { return r.algorithm_id + '/' + r.step_id; }, seedAlgorithms_(), true);
    upsert('Drugs', function (r) { return r.drug_id; }, seedDrugs_(), true);
    upsert('TopicDrugs', function (r) { return r.topic_id + '/' + r.drug_id; }, seedTopicDrugs_(), false);
    upsert('Calculators', function (r) { return r.calc_id; }, seedCalculatorRows_(), false);
    if (typeof SEED_FORMULARY_ !== 'undefined') {
      upsert('Formulary', function (r) { return r.formulary_id; }, SEED_FORMULARY_.map(function (r) {
        var o = {}; Object.keys(r).forEach(function (k) { o[k] = r[k]; });
        o.payment_group = paymentGroupFor_(r.payment); return o;
      }), false);
      var st = readSettings_(), added = [];
      Object.keys(SEED_FORMULARY_SETTINGS_).forEach(function (k) {
        if (!st[k]) { setSetting_(ss, k, SEED_FORMULARY_SETTINGS_[k]); added.push(k); }
      });
      if (added.length) report.push('AppSettings: ' + added.join(', ') + ' filled in');
    }

    // Section notes: fill an empty summary, or replace a note written by 0.4.0.
    var sh = ss.getSheetByName('Sections');
    var v = sh.getDataRange().getValues(), hdr = v[0].map(String);
    var idC = hdr.indexOf('section_id'), sumC = hdr.indexOf('summary');
    var filled = 0, cleared = 0;
    for (var r = 1; r < v.length; r++) {
      var cur = String(v[r][sumC] || '');
      var isOld = SEED_SECTION_NOTES_OLD_.indexOf(cur) >= 0;
      var note = SEED_SECTION_NOTES_[v[r][idC]];
      if (note && (!cur || isOld) && cur !== note) { sh.getRange(r + 1, sumC + 1).setValue(note); filled++; }
      else if (!note && isOld) { sh.getRange(r + 1, sumC + 1).setValue(''); cleared++; }
    }
    report.push('Sections: ' + filled + ' module note(s) written' + (cleared ? ', ' + cleared + ' outdated note(s) cleared' : ''));
    invalidateTables_();
    logChange_(ss, 'update', 'Seed', 'seed-0.11.0', 'Loaded starter content from guideline PDFs and the hospital drug list (all draft)', '', getContentVersion_());
  } finally {
    lock.releaseLock();
  }
  var text = report.join('\n') + '\n\nAll starter rows are DRAFT. Turn on AppSettings ▸ preview_drafts to see them, then publish changes.';
  console.log(text);
  uiAlert_('CPG Pocket — starter content', text);
  return text;
}

var SEED_FORMULARY_SETTINGS_ = { formulary_name: 'รพ.อุตรดิตถ์', formulary_as_of: '2026-11-16' };

/**
 * CPG Pocket — AdminService.gs
 * Authorized content management: propose → review → publish, archive, change history.
 *
 * SECURITY
 * - Every browser-callable function here starts with adminAuth_(role). It reads the
 *   signed-in user's email on the server and checks it against the ADMIN_USERS list in
 *   Script Properties (never sent to the browser). Hiding buttons is not the control.
 * - An anonymous web-app visitor has no email, so every call is refused.
 * - Proposed changes are stored in ReviewQueue. Live rows are written only by
 *   adminPublish(), after the approved changes pass the full database validation.
 * - Every value is checked against the schema (kind, allowed values, pattern,
 *   references, length). Text that Sheets would read as a formula is stored as text.
 *   The app renders all content as text / restricted Markdown, never as raw HTML.
 *
 * Roles (each includes the ones before it):
 *   editor    propose new records, changes and archiving; withdraw own proposals
 *   reviewer  approve, request changes or reject proposals
 *   publisher publish approved changes; manage admin users
 */

var ADMIN_PROP_USERS_ = 'ADMIN_USERS';
var ADMIN_ROLES_ = ['editor', 'reviewer', 'publisher'];
var ADMIN_MAX_TEXT_ = 20000;          // characters per cell (Sheets limit is 50,000)
var ADMIN_OPEN_STATES_ = ['pending', 'approved', 'changes_requested'];

/**
 * Record types the admin can manage.
 * key: column(s) forming the record key. label: column used as the list label.
 * workflow: columns set only by the review/publish workflow (not editable in forms).
 */
var ADMIN_TYPES_ = {
  Topics:          { label: 'title', topic: 'topic_id', key: ['topic_id'],
                     workflow: ['status', 'last_reviewed', 'version', 'updated_at', 'updated_by'] },
  Sections:        { label: 'title', topic: 'topic_id', key: ['section_id'],
                     workflow: ['status', 'last_reviewed', 'reviewer', 'version', 'updated_at', 'updated_by'] },
  Recommendations: { label: 'recommendation_text', topic: 'topic_id', key: ['recommendation_id'],
                     workflow: ['status', 'last_reviewed', 'reviewer', 'version', 'updated_at', 'updated_by', 'source_check'] },
  Drugs:           { label: 'generic_name', topic: null, key: ['drug_id'],
                     workflow: ['status', 'last_reviewed', 'reviewer', 'version', 'updated_at', 'updated_by', 'source_check'] },
  TopicDrugs:      { label: 'drug_id', topic: 'topic_id', key: ['topic_id', 'drug_id'], workflow: [], noArchive: true },
  Algorithms:      { label: 'action', topic: 'topic_id', key: ['algorithm_id', 'step_id'],
                     workflow: ['status', 'last_reviewed', 'reviewer', 'version', 'updated_at', 'updated_by', 'source_check'] },
  References:      { label: 'guideline_title', topic: null, key: ['source_id'],
                     workflow: ['status', 'last_verified', 'verified_by'] },
  Calculators:     { label: 'title', topic: null, key: ['calc_id'],
                     workflow: ['status', 'verified_by', 'verified_at'] },
  // 0.14.1: the hospital drug list goes through the same submit / approve / publish path,
  // otherwise its draft rows disappear when preview_drafts is turned off at launch.
  Formulary:       { label: 'item_name', topic: null, key: ['formulary_id'], workflow: ['status'] }
};

/* ==========================================================================
 * Identity and roles
 * ======================================================================== */

/** @return {Object<string,string>} email (lower case) → role */
function adminUsers_() {
  var raw = PropertiesService.getScriptProperties().getProperty(ADMIN_PROP_USERS_);
  if (!raw) return {};
  try {
    var o = JSON.parse(raw), out = {};
    Object.keys(o).forEach(function (k) { if (ADMIN_ROLES_.indexOf(o[k]) >= 0) out[String(k).toLowerCase()] = o[k]; });
    return out;
  } catch (e) { return {}; }
}

function saveAdminUsers_(users) {
  PropertiesService.getScriptProperties().setProperty(ADMIN_PROP_USERS_, JSON.stringify(users));
}

/** The signed-in user's email as the server sees it ('' when unknown). */
function adminEmail_() {
  var e = '';
  try { e = Session.getActiveUser().getEmail() || ''; } catch (err) { e = ''; }
  return String(e).trim().toLowerCase();
}

function roleRank_(role) { return ADMIN_ROLES_.indexOf(role); }

/**
 * Server-side authorization for every admin call.
 * @param {string} needed 'editor' | 'reviewer' | 'publisher'
 * @return {{email: string, role: string}}
 */
function adminAuth_(needed) {
  var email = adminEmail_();
  if (!email) throw new Error('Not authorized: your Google account could not be identified. Open Admin from the CPG Pocket menu in the Sheet.');
  var role = adminUsers_()[email];
  if (!role) throw new Error('Not authorized: ' + email + ' is not an admin user.');
  if (roleRank_(role) < roleRank_(needed)) throw new Error('Not authorized: this needs the ' + needed + ' role (you are ' + role + ').');
  return { email: email, role: role };
}

/**
 * First run only: when no admin users exist yet, the person opening Admin from
 * the Sheet (running as themselves) becomes publisher.
 */
function adminBootstrapFirstUser_() {
  var users = adminUsers_();
  if (Object.keys(users).length) return false;
  var active = adminEmail_(), effective = '';
  try { effective = String(Session.getEffectiveUser().getEmail() || '').toLowerCase(); } catch (e) { effective = ''; }
  if (!active || active !== effective) return false;
  users[active] = 'publisher';
  saveAdminUsers_(users);
  logChange_(getDb_(), 'setup', 'AdminUsers', active, 'First admin user (publisher)', '', getContentVersion_());
  return true;
}

/* ==========================================================================
 * Menu / web entry points
 * ======================================================================== */

/** Sheet menu: opens the admin screen as a large dialog. */
function openAdmin() {
  adminBootstrapFirstUser_();
  adminAuth_('editor');
  var html = adminPage_().setWidth(1200).setHeight(800);
  SpreadsheetApp.getUi().showModelessDialog(html, 'CPG Pocket — Admin');
}

/** Builds the admin page (used by the Sheet dialog and, when enabled, the web app). */
function adminPage_() {
  var t = HtmlService.createTemplateFromFile('AdminIndex');
  t.appName = APP_CONFIG.APP_NAME;
  return t.evaluate().setTitle(APP_CONFIG.APP_NAME + ' — Admin')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

/** Web app: ?page=admin. Shown only when enabled AND the visitor is an admin. */
function adminWebPage_() {
  var settings = {};
  try { settings = readSettings_(); } catch (e) { settings = {}; }
  var reason = '';
  if (!settingBool_(settings, 'web_admin_enabled')) reason = 'Web editing is switched off (AppSettings ▸ web_admin_enabled). Use CPG Pocket ▸ Open admin in the Google Sheet.';
  else {
    try { adminAuth_('editor'); } catch (e) { reason = e.message; }
  }
  if (reason) {
    var esc = String(reason).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return HtmlService.createHtmlOutput('<!DOCTYPE html><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<div style="font:16px/1.5 -apple-system,Segoe UI,sans-serif;max-width:560px;margin:48px auto;padding:0 16px">' +
      '<h1 style="font-size:20px">CPG Pocket — Admin</h1><p>' + esc + '</p></div>').setTitle('CPG Pocket — Admin');
  }
  return adminPage_();
}

/* ==========================================================================
 * Browser-callable API (each call checks the role on the server)
 * ======================================================================== */

/** Who am I, what can I do, and the editable schema. */
function adminSession() {
  return adminCall_('editor', function (me) {
    var settings = readSettings_();
    var types = Object.keys(ADMIN_TYPES_).map(function (name) {
      var t = ADMIN_TYPES_[name], def = schemaFor_(name);
      return {
        name: name, key: t.key, label: t.label, topic: t.topic, noArchive: !!t.noArchive, clinical: !!def.clinical,
        hasSourceCheck: def.columns.some(function (c) { return c.name === 'source_check'; }),
        fields: def.columns.filter(function (c) { return t.workflow.indexOf(c.name) === -1; }).map(function (c) {
          return { name: c.name, kind: c.kind, required: !!c.required, values: c.values || null, ref: c.ref || null, pattern: c.pattern || null, isKey: t.key.indexOf(c.name) >= 0 };
        })
      };
    });
    return {
      email: me.email, role: me.role, codeVersion: APP_CONFIG.CODE_VERSION, contentVersion: getContentVersion_(),
      allowSelfReview: settingBool_(settings, 'allow_self_review') || settings.allow_self_review === undefined,
      previewDrafts: settingBool_(settings, 'preview_drafts'), types: types, sectionTypes: SECTION_TYPES
    };
  });
}

/** Counts for the dashboard. */
function adminDashboard() {
  return adminCall_('editor', function (me) {
    var queue = readTable_('ReviewQueue'), counts = { pending: 0, approved: 0, changes_requested: 0 }, mine = 0;
    queue.forEach(function (q) {
      if (counts[q.review_status] !== undefined) counts[q.review_status]++;
      if (q.requested_by === me.email && q.review_status === 'changes_requested') mine++;
    });
    var byType = Object.keys(ADMIN_TYPES_).map(function (name) {
      var rows = readTable_(name), c = { type: name, total: rows.length, draft: 0, published: 0, archived: 0, other: 0 };
      rows.forEach(function (r) {
        var st = r.status || (name === 'TopicDrugs' ? 'published' : '');
        if (c[st] !== undefined) c[st]++; else c.other++;
      });
      return c;
    });
    var v = validateDatabase_(getDb_());
    return { counts: counts, myChangesRequested: mine, byType: byType, contentVersion: getContentVersion_(),
             validation: { errors: v.errors.length, warnings: v.warnings.length, firstErrors: v.errors.slice(0, 10) } };
  });
}
